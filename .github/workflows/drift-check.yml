name: drift-check

# Three canaries:
#  - apply-check (every PR + weekly): clone the PRIMARY revision's pinned commits and
#    dry-run the installer. Guarantees the corpus is self-consistent, the pins agree,
#    and the tooling runs. Upstream moving cannot make this one fail — it tests the
#    commits the hunks were generated from.
#  - rev-matrix (every PR + weekly): replay EVERY revision revs.json declares over
#    pristine shallow clones of that revision, so an `inherits` that quietly stopped
#    being true — or a corpus that no longer fits its own branch — goes red here instead
#    of on a player's machine.
#  - tip-check (weekly + manual): clone the live 289 TIPS and dry-run the same way.
#    This answers "has upstream moved under a hunk?" and is EXPECTED to go red when
#    Lost City lands code a hunk no longer anchors to — that is the re-pin reminder
#    (regen against an install at the tip), not a regression here.

on:
  schedule:
    - cron: '30 6 * * 1'      # Monday ~06:30 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'mods/**'
      - 'tools/**'
      - 'root.json'
      - 'revs.json'

jobs:
  # Reads the branch the launcher would install by default (289 today). Shallow clones,
  # so doctor reports the pin as uncomparable (a note) rather than drift — only real
  # anchor drift fails this job.
  tip-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Clone upstream tips beside the overlay
        run: |
          cd ..
          git clone --depth 1 --branch 289 https://github.com/LostCityRS/Client-TS webclient
          git clone --depth 1 --branch 289 https://github.com/LostCityRS/Engine-TS engine

      - name: Would a fresh install still apply?
        run: node tools/lclite.mjs apply --check --rev 289
        # exit 2 == anchor drift on the current tip: time for a re-pin

      - name: Doctor against the tips
        run: node tools/doctor.mjs

  # The revision system's own gate: every declared revision must still take the corpus
  # it resolves to. Cheap (shallow clones, no node_modules, no build).
  rev-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Does every declared revision still apply?
        run: node tools/matrix.mjs
        # exit 2 == a revision's corpus (or an inheritance claim) has expired:
        # node tools/port.mjs <rev> → regen → apply --check

  apply-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Syntax check scripts
        run: |
          node --check tools/lclite.mjs
          node --check tools/lib.mjs
          node --check tools/regen.mjs
          node --check tools/doctor.mjs
          node --check tools/matrix.mjs
          node --check tools/port.mjs
          node --check tools/selfcheck.mjs
          node --check mods/control-panel/files/engine/public/lclite/panel.js
          # every corpus is JSON, for every revision
          for j in mods/*/patches/*/*.json; do node -e "JSON.parse(require('fs').readFileSync('$j','utf8'))" || exit 1; done

      - name: Read the primary revision and its pinned base commits
        id: revs
        run: |
          # revs.json says which revision the corpus is authored on; the corpus then has
          # to agree with it — every patch JSON in that corpus carries
          # generated_from.{repo,head}, and they must all match.
          node -e '
            const fs = require("fs"), path = require("path");
            const primary = JSON.parse(fs.readFileSync("revs.json", "utf8")).primary;
            console.log("primary=" + primary);
            const heads = {};
            for (const mod of fs.readdirSync("mods")) {
              const pd = path.join("mods", mod, "patches", primary);
              if (!fs.existsSync(pd)) continue;
              for (const f of fs.readdirSync(pd).filter(x => x.endsWith(".json"))) {
                const j = JSON.parse(fs.readFileSync(path.join(pd, f), "utf8"));
                if (!j.generated_from?.repo || !j.generated_from?.head) {
                  console.error("missing generated_from:", path.join(pd, f)); process.exit(1);
                }
                const k = j.generated_from.repo;
                if (heads[k] && heads[k] !== j.generated_from.head) {
                  console.error(`mixed base revs for ${k}: ${heads[k]} vs ${j.generated_from.head}`); process.exit(1);
                }
                heads[k] = j.generated_from.head;
              }
            }
            for (const [k, v] of Object.entries(heads)) console.log(`${k}=${v}`);
          ' | tee $GITHUB_OUTPUT

      - name: Clone upstreams beside the overlay
        # tools/lclite.mjs resolves the Lost City root as one level above its own
        # folder. On a dev machine the launcher installs revisions into its own data
        # folder and drives them with LCLITE_ROOT; CI has no launcher, so it clones
        # the pinned revs as siblings of this checkout instead (same shape: a host
        # root holding webclient/ + engine/ + lclite/).
        run: |
          cd ..
          git clone --filter=blob:none https://github.com/LostCityRS/Client-TS webclient
          git clone --filter=blob:none https://github.com/LostCityRS/Engine-TS engine
          git -C webclient checkout ${{ steps.revs.outputs.webclient }}
          git -C engine checkout ${{ steps.revs.outputs.engine }}

      - name: Dry-run installer (anchor drift test)
        run: node tools/lclite.mjs apply --check --rev ${{ steps.revs.outputs.primary }}
        # exit 2 == some hunk's anchor drifted upstream; the log prints which

      - name: Drop-in contract (mods/ folder rule + the layout example still anchors)
        run: node tools/selfcheck.mjs
        # exit 1 == a mod folder stopped being discovered, or mods/_template (what
        # `lclite.mjs new` copies) no longer anchors on the pinned sources

      - name: "Doctor (structural canary: markers, overlap geometry, rev skew, corpora)"
        run: node tools/doctor.mjs
        # exit 2 drift (same signal as above) · exit 3 = overlap/marker gap/rev skew/
        # a corpus that disagrees with revs.json

      - name: Apply for real + diff report
        run: |
          node tools/lclite.mjs apply --no-build --rev ${{ steps.revs.outputs.primary }}
          git -C ../webclient diff --stat
          git -C ../engine diff --stat
          # the mod files must end up modified — a silent zero-diff means the
          # installer stopped working without exiting nonzero
          [ -n "$(git -C ../webclient status --porcelain)" ] || { echo "nothing applied?!"; exit 1; }
