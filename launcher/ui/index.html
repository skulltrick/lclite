// A mod row with a three-way choice. Deliberately not a pair of multi-selects:
// the difference between "wanted" and "banned" is the whole point of the feature
// and it should be readable at a glance.
function myRulesHTML(mods){
  if (!mods.length) return '<div class="empty">no mods found for this install</div>';
  return mods.filter(m => m.available !== false).map(m => {
    const st = myModRules[m.name] || "off";
    const btn = (val, label, title) =>
      `<button class="ghost" style="padding:3px 9px;font-size:11.5px${st === val ? ";border-color:var(--accent);color:var(--accent)" : ""}"
        title="${title}" onclick="setMyRule('${m.name}','${val}')">${label}</button>`;
    return `<div class="modrow">
      <div style="flex:1"><div class="mname">${esc(m.label || m.name)}</div></div>
      <div class="row" style="gap:4px">
        ${btn("off", "—", "no rule")}
        ${btn("req", "wanted", "recommended: players missing it are warned")}
        ${btn("ban", "banned", "not allowed: players running it are asked to turn it off")}
      </div>
    </div>`;
  }).join("");
}

function setMyRule(mod, val){
  if (val === "off") delete myModRules[mod]; else myModRules[mod] = val;
  const el = $("myrules");
  if (el) {
    const i = currentInstall();
    const mods = (i && (i.mods_available || []).length ? i.mods_available : (S.installs || [])[0] && (S.installs || [])[0].mods_available) || [];
    el.innerHTML = myRulesHTML(mods);
  }
  const clash = Object.keys(myModRules).filter(k => myModRules[k] === "req" &&
    Object.keys(myModRules).some(k2 => k2 === k && myModRules[k2] === "ban"));
  void clash;
}

// The form is filled from the saved draft exactly once. Re-filling it on every
// refresh is how a poll eats a half-typed description.
function fillWorldsForm(){
  if (worldsFilled || !W) return;
  const d = (W.my_world || {}).draft || {};
  const set = (id, v) => { const el = $(id); if (el && v != null && v !== "") el.value = v; };
  set("myname", d.name); set("myhost", d.host_name); set("mydesc", d.description); set("myaddr", d.address);
  const sv = $("mysave"); if (sv) sv.checked = !!d.allow_save_import;
  myModRules = {};
  (d.mods_required || []).forEach(n => myModRules[n] = "req");
  (d.mods_forbidden || []).forEach(n => myModRules[n] = "ban");
  const i = currentInstall();
  const mods = (i && (i.mods_available || []).length ? i.mods_available : (S.installs || [])[0] && (S.installs || [])[0].mods_available) || [];
  const el = $("myrules"); if (el) el.innerHTML = myRulesHTML(mods);

  // The address hint is where the host learns what to hand out.
  const hint = $("myaddrhint");
  if (hint) {
    const m = (W.my_world || {});
    const addrs = m.addresses || [];
    const derived = (m.manifest || {}).addr || "";
    const mgmt = W.management || {};
    let s = derived
      ? `Right now this would advertise <span class="path">${esc(derived)}</span> (from ${esc(m.rev || "the running world")}).`
      : `Nothing is running, so there is no address yet — start the world and this fills itself in.`;
    if (addrs.length) s += ` This machine's addresses: <span class="path">${addrs.map(esc).join(", ")}</span>.`;
    if (mgmt.exposed) s += ` <b style="color:var(--bad)">Warning: your world's management page answers on ${esc(mgmt.where || "")} — it has no password and can rewrite this world's config. Do not forward that port.</b>`;
    hint.innerHTML = s;
  }
  worldsFilled = true;
}

/* ---- world actions --------------------------------------------------------- */

async function addWorldCode(){
  const el = $("worldcode");
  const code = ((el || {}).value || "").trim();
  if (!code) { toast("Paste an invite code first.", "bad"); return; }
  try {
    const r = await api("worlds/add", { code });
    if (el) el.value = "";
    if (r.warning) toast(r.warning, "bad"); else toast(`Added ${r.world.name}.`, "good");
    await loadWorlds();
    refreshWorlds(true);
  } catch (e) { toast(e.message, "bad"); }
}

async function refreshWorlds(loud){
  try {
    const r = await api("worlds/refresh", {});
    const up = (r.results || []).filter(x => x.status === "online").length;
    if (loud) toast(`Checked ${(r.results || []).length} worlds — ${up} online.`);
    await loadWorlds();
  } catch (e) { if (loud) toast(e.message, "bad"); }
}

async function toggleWorldFav(id, fav){
  try { await api("worlds/favorite", { id, favorite: !!fav }); await loadWorlds(); }
  catch (e) { toast(e.message, "bad"); }
}

async function forgetWorld(id){
  const v = ((W || {}).worlds || []).find(x => (x.manifest || {}).id === id);
  if (!confirm(`Forget ${v ? v.manifest.name : "this world"}?\n\nIt leaves your list. Nothing on the host is touched, and a new invite code adds it back.`)) return;
  try { await api("worlds/remove", { id }); await loadWorlds(); }
  catch (e) { toast(e.message, "bad"); }
}

// Joining is gated by the world's own mod rules, checked against the tree.
async function joinWorld(id){
  const i = currentInstall();
  if (!i) { toast("Install a revision first — you need a client to play with.", "bad"); return; }
  let r;
  try { r = await api("worlds/check", { id, install: i.id }); }
  catch (e) { toast(e.message, "bad"); return; }

  const rep = r.report || {};
  lastGate = { id, install: i.id, rep, world: r.world };
  renderGate(r);

  if (rep.blocked) {
    toast(`This world does not allow: ${(rep.refused || []).join(", ")}. Turn them off and try again.`, "bad");
    return;
  }
  if ((rep.missing || []).length) {
    const ok = confirm(`This world wants mods you do not have:\n\n  ${rep.missing.join(", ")}\n\n` +
      `You can still join — it may just look or behave differently from what the host expects.\n\nJoin anyway?`);
    if (!ok) return;
  }
  if (!r.rev_ok) {
    const ok = confirm(`This world runs revision ${r.world.rev} and your install is ${r.install_rev}.\n\n` +
      `Different revisions can differ in content and item ids. Join anyway?`);
    if (!ok) return;
  }
  await bridgeToWorld(r.world, i);
}

async function bridgeToWorld(m, i){
  // The manifest's field is `addr` — the card reads it as m.addr, and so must this.
  const addr = (m && (m.addr || m.address)) || "";
  if (!addr) { toast("That world has no address — ask the host for one.", "bad"); return; }
  const urlEl = $("remoteurl"); if (urlEl) urlEl.value = addr;
  const localEl = $("proxylocal"); if (localEl) localEl.value = "1";
  toast(`Bridging to ${m.name} with your own build…`);
  try { await startProxy(); }
  catch (e) { toast("Bridge failed: " + e.message, "bad"); }
}

// The gate's verdict, shown in its own container so a list refresh cannot wipe it.
function renderGate(r){
  const el = $("worldgate");
  if (!el) return;
  const rep = r.report || {};
  const m = r.world || {};
  const bits = [];

  if (rep.blocked) {
    bits.push(`<div class="gate block">
      <h4>${esc(m.name || "That world")} does not allow mods you have on</h4>
      <ul>${(rep.refused || []).map(n => `<li><code>${esc(n)}</code> is applied in <b>${esc(r.install)}</b></li>`).join("")}</ul>
      <div class="hint">Turn ${(rep.refused || []).length === 1 ? "it" : "them"} off and rebuild, then join again.</div>
      <div class="row wrap" style="margin-top:9px">
        <button class="primary" onclick="disableForbidden()">Turn ${(rep.refused || []).length === 1 ? "it" : "them"} off &amp; rebuild</button>
        <button class="ghost" onclick="clearGate()">Dismiss</button>
      </div>
    </div>`);
  } else if ((rep.missing || []).length) {
    bits.push(`<div class="gate warn">
      <h4>${esc(m.name || "That world")} wants mods you do not have</h4>
      <ul>${(rep.missing || []).map(n => `<li><code>${esc(n)}</code> — not applied here</li>`).join("")}</ul>
      <div class="hint">You are allowed in regardless: a "wanted" mod is a recommendation the host is telling you about.</div>
      <div class="row wrap" style="margin-top:9px"><button class="ghost" onclick="clearGate()">Dismiss</button></div>
    </div>`);
  }

  const digest = rep.digest ? `<span title="fingerprint of the client build you would serve">build <span class="mono">${esc(rep.digest)}</span></span>` : "";
  bits.push(`<div class="hint">Checked <b>${esc(r.install)}</b> against what is actually applied (not what the mods panel had ticked).
    ${(rep.applied || []).length} mods applied${digest ? " · " + digest : ""}.
    ${(rep.unknown || []).length ? `This world names mods this overlay does not have: <code>${(rep.unknown || []).map(esc).join("</code>, <code>")}</code>.` : ""}</div>`);

  el.innerHTML = bits.join("");
}

function clearGate(){ const el = $("worldgate"); if (el) el.innerHTML = ""; lastGate = null; }

// The one-click repair for the case that actually happens: you forgot a mod was on.
async function disableForbidden(){
  const g = lastGate;
  if (!g) return;
  const i = currentInstall();
  if (!i) return;
  const banned = new Set(g.rep.refused || []);
  const here = new Set((i.mods_available || []).filter(m => m.available !== false).map(m => m.name));
  // The honest base is what the TREE says is applied — not what the panel had ticked.
  const next = (g.rep.applied || []).filter(n => !banned.has(n) && here.has(n));
  if (!confirm(`Turn off ${[...banned].join(", ")} and rebuild?\n\nThis applies ${next.length} mods to ${i.id} and can take a minute.`)) return;
  toast(`Rebuilding without ${[...banned].join(", ")}…`);
  try {
    const r = await api("apply", { id: i.id, mods: next });
    const job = await waitForJob(r.job);
    toast(job.status === "ok" ? "Rebuilt — try joining again." : (job.err || "apply failed"), job.status === "ok" ? "good" : "bad");
  } catch (e) { toast(e.message, "bad"); }
  await refresh();
}

/* ---- listing your own world ------------------------------------------------ */

function showMyWorld(){
  const d = $("myworld");
  if (d) { d.open = true; d.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  fillWorldsForm();
}

async function publishWorld(){
  const req = {
    name: ($("myname") || {}).value || "",
    description: ($("mydesc") || {}).value || "",
    host_name: ($("myhost") || {}).value || "",
    address: ($("myaddr") || {}).value || "",
    mods_required: Object.keys(myModRules).filter(k => myModRules[k] === "req"),
    mods_forbidden: Object.keys(myModRules).filter(k => myModRules[k] === "ban"),
    allow_save_import: !!($("mysave") || {}).checked,
  };
  const out = $("myworldout");
  try {
    const r = await api("world/publish", req);
    if (out) {
      out.innerHTML = `<div class="gate">
        <h4 style="color:var(--good)">Listed — hand out this code</h4>
        <div class="hint" style="margin-top:0">Anyone with this code can add your world. It is signed with this launcher's key,
        so if somebody edits it, their copy is refused. Your key's fingerprint:</div>
        <div class="codebox">${esc(r.fingerprint || "")}</div>
        <div class="codebox" id="mycode">${esc(r.code || "")}</div>
        <div class="row wrap" style="margin-top:9px">
          <button class="primary" onclick="copyText(document.getElementById('mycode').textContent,'Invite code')">Copy the code</button>
          <button class="ghost" onclick="copyInviteCode()">Copy from the card above</button>
        </div>
        <div class="hint">${(r.code || "").length} characters. Start the world and press <b>Check which are online</b> on the card above to confirm it answers.</div>
      </div>`;
    }
    toast("Your world is listed locally — copy the code to share it.", "good");
    await loadWorlds();
  } catch (e) {
    if (out) out.innerHTML = `<div class="gate block"><h4>Not listed</h4><div class="hint" style="margin-top:0">${esc(e.message)}</div></div>`;
    toast(e.message, "bad");
  }
}

function copyInviteCode(){
  const self = ((W || {}).worlds || []).find(v => v.self);
  if (!self || !self.code) { toast("Nothing to copy yet — press List my world first.", "bad"); return; }
  copyText(self.code, "Invite code");
}

async function copyText(s, what){
  if (!s) { toast("Nothing to copy.", "bad"); return; }
  try { await navigator.clipboard.writeText(s); toast((what || "Copied") + " to the clipboard.", "good"); return; }
  catch (e) { /* fall through to the old way */ }
  const ta = document.createElement("textarea");
  ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast((what || "Copied") + " to the clipboard.", "good"); }
  catch (e) { toast("Could not copy — select the text and copy it by hand.", "bad"); }
  ta.remove();
}

/* ---- the save vault -------------------------------------------------------- */

async function loadSaves(loud){
  const i = currentInstall();
  if (!i) { if (loud) toast("Pick an install first.", "bad"); return; }
  try {
    SV = await api("saves?install=" + encodeURIComponent(i.id));
    renderSaves();
    if (loud) toast(`${(SV.saves || []).length} characters in ${i.id}.`);
  } catch (e) { if (loud) toast(e.message, "bad"); }
}

function renderSaves(){
  const el = $("savelist");
  if (!el) return;
  if (!SV) { el.innerHTML = '<div class="empty">open this to load your characters</div>'; return; }
  const list = SV.saves || [];
  if (!list.length) {
    el.innerHTML = `<div class="empty">No characters in <b>${esc(SV.install)}</b> yet — log in once and one appears here.</div>`;
    return;
  }
  const rows = list.map(s => `
    <div class="modrow">
      <div style="flex:1">
        <div class="mname">${esc(s.username)} ${s.in_vault ? '<span class="wtag ok" title="a copy is in your vault">in vault</span>' : ""}</div>
        <div class="mdesc">${(s.size / 1024).toFixed(1)} KB · ${ago(s.modified)}${s.problem ? ` · <span style="color:var(--bad)">${esc(s.problem)}</span>` : ""}</div>
      </div>
      <div class="row" style="gap:5px">
        <button class="ghost" style="padding:4px 10px;font-size:12px" ${s.intact ? "" : "disabled"}
          title="${s.intact ? "copy this character into your vault on this machine" : "this file is damaged — vaulting it would make the vault a trap"}"
          onclick="vaultSave('${esc(s.username)}')">Vault</button>
      </div>
    </div>`).join("");
  el.innerHTML = `<div class="hint" style="margin-top:0">${list.length} character${list.length === 1 ? "" : "s"} in
    <span class="path">${esc(SV.dir)}</span>${SV.running ? ' — <b>this world is running</b>, so imports are refused until you stop it' : ""}</div>
    <div class="modlist">${rows}</div>`;
}

async function vaultSave(username){
  const i = currentInstall(); if (!i) return;
  try {
    const r = await api("saves/export", { install: i.id, username, vault: true });
    toast(`Vaulted ${username} — ${r.path}`, "good");
    await loadSaves();
  } catch (e) { toast(e.message, "bad"); }
}

async function importSave(){
  const i = currentInstall();
  if (!i) { toast("Pick an install first.", "bad"); return; }
  const path = (($("imppath") || {}).value || "").trim();
  const username = (($("impname") || {}).value || "").trim();
  if (!path) { toast("Give a path to a character file.", "bad"); return; }
  try {
    const r = await api("saves/import", { install: i.id, path, username, world_allows: true });
    const res = r.result || {};
    toast(`Imported ${res.username}${res.replaced ? " (the previous character was kept beside it)" : ""}.`, "good");
    (res.warnings || []).forEach(w => toast(w));
    await loadSaves();
  } catch (e) {
    // The "newer character already there" case is the one worth offering a way past.
    if (/newer save/i.test(e.message) && confirm(e.message + "\n\nImport anyway?")) {
      try {
        await api("saves/import", { install: i.id, path, username, force: true, world_allows: true });
        toast("Imported over it — the old character was kept beside it.", "good");
        await loadSaves();
      } catch (e2) { toast(e2.message, "bad"); }
      return;
    }
    toast(e.message, "bad");
  }
}

async function pickSaveFile(){
  const d = $("imppath");
  const dir = (d && d.value) || "";
  try {
    const r = await api("saves/browse" + (dir ? "?dir=" + encodeURIComponent(dir) : ""));
    const files = (r.entries || []).filter(e => !e.dir);
    if (!files.length) { toast(`No .sav files in ${r.dir}.`, "bad"); return; }
    const pick = files[0];
    const name = prompt(`Character file in ${r.dir}:\n\n${files.map(f => f.name).join("\n")}\n\nType the file name to use:`, pick.name);
    if (!name) return;
    if (d) d.value = r.dir + (r.dir.endsWith("\\") || r.dir.endsWith("/") ? "" : "\\") + name;
  } catch (e) { toast(e.message, "bad"); }
}

/* ---- one-revision-at-a-time stepper ------------------------------------- */
let revStep = 0;

function revRowStep(list){
  const rows = list.querySelectorAll(".rev");
  if (rows.length < 2) return rows[0] ? rows[0].offsetHeight + 7 : 0;
  return rows[1].offsetTop - rows[0].offsetTop;   // gap-proof: ask the layout
}

function stepRev(delta){
  const list = $("revlist");
  if (!list) return;
  const n = list.querySelectorAll(".rev").length;
  revStep = Math.max(0, Math.min(n - 1, revStep + delta));
  list.scrollTop = revStep * revRowStep(list);
  updateRevCount(list);
}

function updateRevCount(list){
  const el = $("revcount");
  if (!el || !list) return;
  const n = list.querySelectorAll(".rev").length;
  el.textContent = `${n ? revStep + 1 : 0} / ${n}`;
  const up = $("revup"), down = $("revdown");
  if (up) up.disabled = revStep <= 0;
  if (down) down.disabled = revStep >= n - 1;
}

// keep the arrows honest when the mouse wheel is used instead of the buttons
function wireRevScroll(){
  const list = $("revlist");
  if (!list) return;
  updateRevCount(list);
  list.onscroll = () => {
    const step = revRowStep(list);
    if (step > 0) revStep = Math.max(0, Math.round(list.scrollTop / step));
    updateRevCount(list);
  };
  list.scrollTop = revStep * revRowStep(list);
}

function renderMain(force){
  const sRevs = JSON.stringify((S.revs || []).map(r => [r.name, r.recommended, r.engine, r.content]))
    + "|" + overlayRevs().join(",") + "|" + JSON.stringify((S.installs || []).map(i => [i.id, i.rev_label, i.engine_deps, i.mods_allowed]));
  // The install list and the card under it describe the same rows, so they share
  // one signature; the mods panel gets its own (it is the one block a poll must
  // never rebuild while you are ticking boxes).
  const sInstalls = JSON.stringify((S.installs || []).map(i => [i.id, i.path, i.custom, i.missing, i.rev_label,
    i.engine_deps, i.mods_allowed, (i.mods || []).length, i.built_at, i.has_overlay, i.has_client, i.has_engine, i.client_bundle])) + "|" + sel;
  const cur = currentInstall();
  const sMods = JSON.stringify(cur ? [cur.id, cur.rev_label, cur.missing, cur.mods_allowed, cur.has_overlay,
    cur.overlay_source, cur.overlay_path, cur.mods, (cur.mods_available || []).length] : null) + "|" + overlayRevs().join(",");

  if (force || sRevs !== sig.revs) { sig.revs = sRevs; const el = $("revlist"); if (el) el.innerHTML = revRows(); wireRevScroll(); }
  if (force || sInstalls !== sig.installs) {
    sig.installs = sInstalls;
    const el = $("installs"); if (el) el.innerHTML = installRows();
    const card = $("installcard"); if (card) card.innerHTML = installCardHTML();
  }
  if (force || sMods !== sig.mods) {
    sig.mods = sMods;
    const el = $("mods");
    if (el) {
      const i = currentInstall();
      // the baseline for "did you change the selection" is what CAN be applied here
      modsBase = i ? ((i.mods && i.mods.length) ? i.mods.slice() : (i.mods_available || []).filter(m => m.available !== false).map(m => m.name)) : [];
      initModPick(i);
      el.innerHTML = modsHTML();
      refreshModsDirty();
    }
  }

  renderServerLive();
  renderWorlds(false);
  const js = $("jobstatus");
  const j = S.job;
  if (js) js.innerHTML = j ? `${esc(j.kind)} · <b>${esc(j.status)}</b>${j.step ? " · " + esc(j.step) : ""}` : (S.busy ? "working…" : "");
}

// The server card is updated in place: re-rendering it would wipe a half-typed port.
function renderServerLive(){
  const e = S.engine || {}, p = S.proxy || {};
  const state = e.state || "stopped";
  const dot = $("sdot");
  if (dot) dot.className = "dot " + (state === "running" ? "live" : state === "starting" ? "busy" : "");
  const st = $("serverstatus");
  if (st) {
    const url = `http://localhost${e.port == 80 ? "" : ":" + (e.port || 0)}/rs2.cgi`;
    st.innerHTML = state === "running"
      ? `serving <b>${esc(e.install)}</b> on port ${e.port}${e.game_port ? ` <span class="chip">game ${e.game_port}</span>` : ""} — <a href="${url}" target="_blank">open client</a>`
      : state === "starting" ? `starting <b>${esc(e.install)}</b>… first boot repacks the cache`
      : state === "failed" ? `<span style="color:var(--bad)">stopped: ${esc(e.error || "see the log")}</span>`
      : "no world running";
  }
  const pb = $("playbtn"); if (pb) pb.disabled = state === "running" || state === "starting";
  const sb = $("stopbtn"); if (sb) sb.disabled = !(state === "running" || state === "starting");
  const bb = $("bridgebtn"); if (bb) bb.disabled = !!p.running;
  const sbb = $("stopbridgebtn"); if (sbb) sbb.disabled = !p.running;
  // The bridge has no card title to carry its state any more, so say it here —
  // and say it live, or the panel claims "not bridging" while it is.
  const bh = $("bridgehint");
  if (bh) bh.innerHTML = p.running
    ? `<span class="pill good">bridging</span> ${esc(p.target || "")} — <a href="${p.url || "#"}" target="_blank">open your client</a>`
    : "Not bridging. <b>Bridge &amp; play</b> gives a remote server a localhost address so your browser can reach it.";
  const port = $("port");
  if (port && !port.dataset.touched && (state === "running" || state === "starting") && e.port) port.value = e.port;
}

/* ---------------------------------------------------------------- actions */
function selectInstall(id){ sel = id; render(); }
async function install(rev){
  toast(`Installing ${rev} — this takes a minute…`);
  const r = await act(() => api("install", { rev, client: true, overlay: hasMods(rev) }), "install");
  if (!r) return;
  const job = await waitForJob(r.job);
  if (job.status === "ok") { sel = rev; toast(`${rev} is ready — press Start.`, "good"); }
  else toast(job.err || "install failed", "bad");
  await refresh();
}
// From the wizard's last step: remember that finishing is the intent.
function playFromWizard(){
  wiz.autoFinish = true;
  play();
}
async function play(id){
  const inst = id ? (S.installs || []).find(i => i.id === id) : currentInstall();
  if (!inst) { toast("Pick an install first.", "bad"); return; }
  sel = inst.id;
  const field = $("port") || $("wizport");
  const port = parseInt((field && field.value) || "0", 10);
  const r = await act(() => api("run", { id: inst.id, port, open: true }), "play", true);
  if (r) { setLog("server"); toast(`Starting ${inst.id} — the client opens when the world is up.`, "good"); }
  await refresh();
}
async function stopServer(){ await act(() => api("stop", {}), "stop", true); toast("Server stopped."); await refresh(); }
async function openClient(){
  const e = S.engine || {};
  if (e.port) window.open(`http://localhost${e.port == 80 ? "" : ":" + e.port}/rs2.cgi`, "_blank");
}
async function applyMods(){
  const i = currentInstall(); if (!i) return;
  // only mods that exist for this revision: the rest are reported, not requested
  const here = new Set((i.mods_available || []).filter(m => m.available !== false).map(m => m.name));
  const mods = modSelection().filter(n => here.has(n));
  toast(`Applying ${mods.length} mods and rebuilding…`);
  const r = await act(() => api("apply", { id: i.id, mods }), "apply");
  if (!r) return;
  const job = await waitForJob(r.job);
  toast(job.status === "ok" ? "Mods are live — reload the client page." : (job.err || "apply failed"), job.status === "ok" ? "good" : "bad");
  await refresh();
}
async function revertMods(){ const i = currentInstall(); if (!i) return; const r = await act(() => api("reset", { id: i.id }), "reset"); if (r) toast("Working tree reset to pristine."); await refresh(); }
async function stripMods(){ const i = currentInstall(); if (!i) return; const r = await act(() => api("strip", { id: i.id }), "strip"); if (r) toast("Every mod is off — back to upstream."); await refresh(); }
async function buildOnly(){ const i = currentInstall(); if (!i) return; const r = await act(() => api("build", { id: i.id }), "build"); if (r) await waitForJob(r.job); await refresh(); }
async function updateInstall(){ const i = currentInstall(); if (!i) return; const r = await act(() => api("update", { id: i.id }), "update"); if (r) { await waitForJob(r.job); toast("Updated from GitHub."); } await refresh(); }
// id first, then wipe: the row's own buttons pass both, so clicking "Delete
// files" on 254 can never act on whichever install happens to be selected.
async function removeInstall(id, wipe){
  const i = (S.installs || []).find(x => x.id === id) || currentInstall();
  if (!i) { toast("That install is already gone.", "bad"); await refresh(); return; }
  if (wipe && !confirm(`Delete ${i.path} from disk?\n\nEverything in that folder goes — you can install ${i.rev_label || i.id} again from the revision list above.`)) return;
  try {
    await api("remove", { id: i.id, wipe: !!wipe });
  } catch (e) {
    toast(e.message, "bad");
    await refresh();
    return;
  }
  if (sel === i.id) sel = null;
  toast(wipe ? `${i.id} deleted — the folder is gone.` : `${i.id} removed from the list — files left in place.`, "good");
  await refresh();
}
async function startProxy(){
  const i = currentInstall();
  const url = ($("remoteurl") || {}).value || "";
  const port = parseInt(($("proxyport") || {}).value || "8890", 10);
  const local = ($("proxylocal") || {}).value === "1";
  const r = await act(() => api("proxy/start", { url: url.trim(), port, local_client: local, id: local && i ? i.id : "" }), "bridge", true);
  if (r) { setLog("proxy"); toast(`Bridge up — your client opens at ${r.url}`, "good"); }
  await refresh();
}
async function stopProxy(){ await act(() => api("proxy/stop", {}), "bridge", true); toast("Bridge stopped."); await refresh(); }
async function openDirect(){ const url = (($("remoteurl") || {}).value || "").trim(); if (!url) { toast("Type a server address first.", "bad"); return; } await act(() => api("open", { url }), "open", true); }
function showTools(){
  const list = (S.tools || [])
    .map(t => `${t.name} ${String(t.version || "").replace(/^v/, "").replace(new RegExp("^" + t.name + "\\s*", "i"), "").replace(/^git version\s*/i, "").trim()}`)
    .join(" · ");
  toast(list || "no tools detected", "good");
}
async function installBun(){ toast("Fetching bun…"); const r = await act(() => api("bun", {}), "bun"); if (r) await waitForJob(r.job); await refresh(); }
async function pickFolder(forWizard){
  const r = await act(() => api("browse", { start: folder }), "browse", true);
  if (!r) return;
  if (forWizard) { wiz.path = r.path; await importFolder(true); return; }
  folder = r.path;
  const el = $("importpath"); if (el) el.textContent = folder;
  const btn = el && el.parentElement.querySelector("button.primary");
  if (btn) btn.disabled = false;
}
async function importFolder(fromWizard){
  const path = fromWizard ? wiz.path : folder;
  if (!path) { toast("Pick a folder first.", "bad"); return; }
  try {
    const r = await api("import", { path });
    if (r.install) {
      sel = r.install.id;
      folder = "";
      toast(`Added ${r.install.id} from ${r.install.path}`, "good");
      if (fromWizard) { wiz.rev = r.install.rev_label || r.install.id; wiz.step = DONE; await refresh(); return; }
    }
  } catch (e) { toast(e.message, "bad"); }
  await refresh();
}
async function openWizardAgain(){
  view = "wizard";
  wiz = { step: PICK, rev: (S.recommended || null), path: "", jobId: null, phase: -1, error: "", mode: "add", autoFinish: false, leaving: false };
  render();
}
function toggleConsole(){ const c = $("console"); if (c) c.classList.toggle("min"); }
// The console lives in the dashboard, so hand the user over rather than
// pretending a button did something.
function openConsoleNow(){
  view = "main";
  render();
  toast("Still installing — the running log is in the console at the bottom.", "good");
}
function clearLog(){ mainLog = []; const b = $("logbody"); if (b) b.innerHTML = ""; }
async function quitLauncher(){
  if (!confirm("Close the launcher? A running world or bridge is stopped too.")) return;
  await act(() => api("quit", {}), "quit", true);
  document.body.innerHTML = '<div style="padding:60px;text-align:center;color:#a2937f;font:15px system-ui">LCLite launcher stopped — you can close this tab.</div>';
}

/* ---------------------------------------------------------------- console */
function setLog(which){
  logWhich = which;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.which === which));
}
function classify(text){
  if (text.startsWith("!!")) return "err";
  if (text.startsWith("== ")) return "step";
  if (text.startsWith("$ ")) return "cmd";
  if (/ready|is up|world ready|deployed/i.test(text)) return "ok";
  return "";
}
function pushLog(cls, text){
  mainLog.push([cls, text]);
  if (mainLog.length > 2000) mainLog = mainLog.slice(-1200);
  const b = $("logbody");
  if (!b) return;
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = text;
  b.appendChild(d);
  while (b.childElementCount > 1400) b.removeChild(b.firstChild);
  b.scrollTop = b.scrollHeight;
}
async function pollLog(){
  if (!S) return;
  try {
    if (logWhich === "job") {
      const r = await api("job?since=" + cursors.job + (busyJob ? "&id=" + encodeURIComponent(busyJob) : ""));
      const j = r.job;
      if (j) {
        for (const ln of j.lines || []) { cursors.job = Math.max(cursors.job, ln.n + 1); pushLog(classify(ln.text), ln.text); }
        if (j.status !== "running") busyJob = null;
      }
    } else {
      const r = await api("log?which=" + logWhich + "&since=" + cursors[logWhich]);
      for (const ln of r.lines || []) { cursors[logWhich] = Math.max(cursors[logWhich], ln.n + 1); pushLog(classify(ln.text), ln.text); }
    }
  } catch (e) {}
}

/* ---------------------------------------------------------------- logo */
function logo(size){
  // crescent cut from one disc by another (no library, no asset), plus a
  // three-star cluster — the LCLite moon, drawn at any size.
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7e2ac"/><stop offset="0.55" stop-color="#e6bb63"/><stop offset="1" stop-color="#b8862c"/>
      </linearGradient>
      <mask id="cut"><rect width="48" height="48" fill="#fff"/><circle cx="31" cy="17" r="15.5" fill="#000"/></mask>
    </defs>
    <circle cx="23" cy="24" r="17" fill="url(#lg)" mask="url(#cut)"/>
    <path d="M33 22.5l1.5 3.4 3.4 1.5-3.4 1.5-1.5 3.4-1.5-3.4-3.4-1.5 3.4-1.5z" fill="#fff3d0" opacity=".92"/>
    <circle cx="41" cy="15" r="1.5" fill="#fff3d0" opacity=".75"/>
    <circle cx="37" cy="33" r="1.1" fill="#fff3d0" opacity=".6"/>
  </svg>`;
}

/* ---------------------------------------------------------------- boot */
async function boot(){
  await refresh(true);
  await pollLog();
  const stale = !S.revs_at || S.revs_at.startsWith("0001") || (Date.now() - new Date(S.revs_at).getTime()) > 6 * 3600e3;
  if (stale) refreshRevs(false);   // in the background: the cached list is already usable
}
boot();
setInterval(refresh, 2500);
setInterval(pollLog, 900);
document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) return;
  if (view === "main" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault(); stepRev(e.key === "ArrowDown" ? 1 : -1); return;
  }
  if (e.key === "Escape" && wiz.step > WELCOME && (S.installs || []).length) finishWizard();
  if (e.key === "Enter" && !e.target.matches("input,select,button")) {
    if (wiz.step === PICK && wiz.rev) wizGo(READY2GO);
    else if (wiz.step === READY2GO) wizInstall();
  }
});
</script>
