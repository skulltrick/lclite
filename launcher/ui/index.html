// The Join panel, patched in place like the server card.
//
// Two rules, both from the same reason: this panel holds inputs.
//
//  1. The setup block is only ever hidden/shown, never re-rendered — rebuilding it
//     would throw away a half-typed address on every 2.5s poll.
//  2. The joined card is rebuilt only when what it says has changed, keyed on the
//     proxy state rather than the whole /api/state payload.
function renderJoinLive(){
  const p = S.proxy || {};
  const setup = $("joinsetup");
  if (setup) setup.style.display = p.running ? "none" : "";
  const card = $("joinedcard");
  if (!card) return;

  // Nothing to describe once the tunnel is down, and the setup is back.
  if (!p.running) {
    if (sig.join) { sig.join = ""; card.innerHTML = ""; }
    return;
  }
  const cur = currentInstall();
  const s = JSON.stringify([p.running, p.joined || null, p.url || "", p.target || "", cur ? cur.id : ""]);
  if (s === sig.join) return;
  sig.join = s;
  card.innerHTML = joinedHTML(p);
}

/* ------------------------------------------------- the LCLite update button */
// One button in the header, four answers about LCLite itself (not about Lost City):
// press it and it asks the LCLite repo whether there is anything new — newer mods,
// newer tools — and then either offers to pull them or says there is nothing to do.
//
//   Check for update → (press) → Update | Up-to-date | Offline
//
// The state lives here AND in the launcher (`S.overlay`), so a reload shows the
// button it was showing: the check is your press, never something the 2.5s poll does
// behind your back. `ovl.busy` is a state of its own, because "Checking…" must not be
// overwritten by a poll either.
const OVL_LABEL = { check: "Check for update", checking: "Checking…", update: "Update", updating: "Updating…", uptodate: "Up-to-date", offline: "Offline", none: "No overlay" };
let ovl = { state: "", info: null, busy: "" };

function ovlStatus(){ return ovl.busy || ovl.state || "check"; }

// What the button is offering, in words — including the reason when it cannot offer
// anything (offline says what git said, not just "offline").
function ovlTitle(st, o){
  o = o || {};
  const branch = o.branch || "the repo";
  switch (st) {
    case "checking": return "asking the LCLite repo whether anything has changed…";
    case "updating": return "pulling the new LCLite files…";
    case "update": {
      const what = o.shallow ? `newer LCLite files on ${branch}` : `${o.behind} newer LCLite commit${o.behind === 1 ? "" : "s"} on ${branch}`;
      return `${what} — press to pull them into ${o.path || "your checkout"}.`
        + (o.dirty ? " This checkout has uncommitted changes, so the update will refuse until they are committed or stashed." : "")
        + " Your installs keep their current mods until you press Apply changes.";
    }
    case "uptodate": return `nothing to update — ${o.path ? o.path + " matches " : ""}${branch}`
      + (o.head ? " @ " + String(o.head).slice(0, 7) : "")
      + (o.ahead ? ` (and is ${o.ahead} commit${o.ahead === 1 ? "" : "s"} ahead of it)` : "");
    case "offline": return "could not reach the LCLite repo — " + (o.note || "no connection") + " (press to try again)";
    case "none": return o.note || "there is no LCLite overlay here to update";
    default: return "ask the LCLite repo whether there is anything new to pull";
  }
}

function renderOverlayBtn(){
  const b = $("overlaybtn");
  if (!b) return;
  // Adopt what the launcher already knows: a reload (or coming back from the setup
  // guide) shows the button it was showing instead of asking again.
  if (!ovl.busy && !ovl.state && S && S.overlay && S.overlay.state) { ovl.state = S.overlay.state; ovl.info = S.overlay; }
  const st = ovlStatus();
  b.textContent = OVL_LABEL[st] || OVL_LABEL.check;
  b.className = st === "update" ? "primary" : "ghost";
  b.disabled = st === "checking" || st === "updating" || st === "uptodate" || st === "none";
  b.title = ovlTitle(st, ovl.info);
}

function overlayAction(){
  if (ovlStatus() === "update") return overlayUpdate();
  return overlayCheck();
}

async function overlayCheck(){
  ovl.busy = "checking"; renderOverlayBtn();
  try {
    const r = await api("overlay/check", {});
    ovl.info = r.overlay || null;
    ovl.state = (r.overlay && r.overlay.state) || "offline";
  } catch (e) {
    ovl.state = "offline"; ovl.info = { note: e.message };
  }
  ovl.busy = "";
  renderOverlayBtn();
  const o = ovl.info || {};
  if (ovl.state === "update") toast(o.shallow ? "There are newer LCLite files — press Update." : `${o.behind} newer LCLite commit${o.behind === 1 ? "" : "s"} — press Update.`, "good");
  else if (ovl.state === "uptodate") toast("LCLite is up to date.", "good");
  else if (ovl.state === "offline") toast("Could not reach the LCLite repo: " + (o.note || "offline"), "bad");
  else toast(o.note || "There is no LCLite overlay here to update.", "bad");
}

async function overlayUpdate(){
  ovl.busy = "updating"; renderOverlayBtn();
  try {
    const r = await api("overlay/update", {});
    if (!r || !r.job) throw new Error("the launcher did not start the update");
    const job = await waitForJob(r.job);
    if (job.status === "ok") toast("LCLite updated — press Apply changes on an install to build it in.", "good");
    else toast(job.err || "the update failed", "bad");
  } catch (e) {
    toast("Update failed: " + e.message, "bad");
  }
  ovl.busy = "";
  // The launcher's own answer is the truth after an update (it re-checked the
  // checkout); take it rather than assuming. busy stays set until it lands, so the
  // button cannot flash the pre-update state on the way.
  await refresh();
  ovl.state = (S && S.overlay && S.overlay.state) || "";
  ovl.info = (S && S.overlay) || null;
  renderOverlayBtn();
}

async function applyMods(){
  const i = currentInstall(); if (!i) return;

/* ---------------------------------------------------------------- console */
// ONE console, one feed. The launcher merges every producer (jobs, the world, the
// bridge) server-side behind a single cursor, so there is nothing to switch between
// and no line can land in the "wrong" tab — each line just says where it came from.
const SRC_LABEL = { task: "task", world: "world", bridge: "bridge", lclite: "lclite" };
let logQuery = "", logFollow = true;

function classify(text){
  if (text.startsWith("!!")) return "err";
  if (text.startsWith("== ")) return "step";
  if (text.startsWith("$ ")) return "cmd";
  if (/ready|is up|world ready|deployed/i.test(text)) return "ok";
  return "";
}
// The URL in a line is usually the useful part of it (your client's address, the
// bridge's, a clone URL), so it becomes a link. Text is escaped FIRST — only http(s)
// survives as markup, which is what keeps a log line from injecting any.
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<>"']+)/g,
    u => `<a href="${u}" target="_blank" rel="noreferrer">${u}</a>`);
}
function logLine(cls, text, src){
  const d = document.createElement("div");
  d.className = "ln" + (cls ? " " + cls : "");
  d.dataset.src = src || "";
  d.dataset.text = text;
  d.title = "click to copy this line";
  d.innerHTML = `<span class="src ${esc(src || "")}">${esc(SRC_LABEL[src] || src || "")}</span>`
    + `<span class="txt">${linkify(text)}</span>`;
  d.onclick = ev => {
    // A link is a link, and copying a line you are selecting by hand would be rude.
    if (ev.target.closest("a") || String(window.getSelection() || "")) return;
    copyLine(text);
  };
  return d;
}
function copyLine(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Line copied.", "good"),
      () => toast("Could not copy that.", "bad"));
  } else {
    toast("Copying needs the page in a browser window.", "bad");
  }
}
function logMatch(d){
  if (!logQuery) return true;
  return (d.dataset.src || "").includes(logQuery) || (d.dataset.text || "").toLowerCase().includes(logQuery);
}
function pushLog(cls, text, src){
  mainLog.push([cls, text, src]);
  if (mainLog.length > 2000) mainLog = mainLog.slice(-1200);
  const b = $("logbody");
  if (!b) return;
  const ph = b.querySelector(".placeholder");
  if (ph) ph.remove();
  const d = logLine(cls, text, src);
  if (!logMatch(d)) d.style.display = "none";
  b.appendChild(d);
  while (b.childElementCount > 1400) b.removeChild(b.firstChild);
  // Following the tail is the default; scrolling up to read stops it (and the
  // "Latest" button appears), because a feed that yanks itself back down is
  // unreadable while a build runs.
  if (logFollow) b.scrollTop = b.scrollHeight;
  logCount();
}
function logScrolled(){
  const b = $("logbody");
  if (!b) return;
  logFollow = b.scrollHeight - b.scrollTop - b.clientHeight < 24;
  const j = $("logjump");
  if (j) j.style.display = logFollow ? "none" : "";
}
function logToBottom(){
  logFollow = true;
  const b = $("logbody");
  if (b) b.scrollTop = b.scrollHeight;
  const j = $("logjump");
  if (j) j.style.display = "none";
}
function filterLog(){
  logQuery = (($("logfilter") || {}).value || "").trim().toLowerCase();
  const b = $("logbody");
  if (!b) return;
  for (const d of b.querySelectorAll(".ln")) d.style.display = logMatch(d) ? "" : "none";
  logCount();
  if (logFollow) b.scrollTop = b.scrollHeight;
}
function logCount(){
  const el = $("logcount");
  if (!el) return;
  if (!logQuery) { el.textContent = ""; return; }
  const b = $("logbody");
  const all = b ? b.querySelectorAll(".ln").length : 0;
  const shown = b ? [...b.querySelectorAll(".ln")].filter(d => d.style.display !== "none").length : 0;
  el.textContent = shown ? `${shown} of ${all}` : "no line matches";
}
// The console body is rebuilt empty whenever the whole view is (coming back from
// the wizard), so replay what we have rather than losing the install you just
// watched — and say something when there is nothing yet.
function renderConsole(){
  const b = $("logbody");
  if (!b) return;
  b.innerHTML = "";
  if (!mainLog.length) {
    const d = document.createElement("div");
    d.className = "placeholder";
    d.textContent = "nothing yet — installs, your world and the join bridge all report here";
    b.appendChild(d);
  }
  for (const [cls, text, src] of mainLog) b.appendChild(logLine(cls, text, src));
  filterLog();
  if (logFollow) b.scrollTop = b.scrollHeight;
}
async function pollLog(){
  if (!S) return;
  try {
    const r = await api("log?since=" + cursors.console);
    for (const ln of r.lines || []) {
      cursors.console = Math.max(cursors.console, ln.n + 1);
      pushLog(classify(ln.text), ln.text, ln.src);
    }
  } catch (e) {}
}

/* ---------------------------------------------------------------- logo */
function logo(size){
  // crescent cut from one disc by another (no library, no asset), plus a
  // three-star cluster — the LCLite moon, drawn at any size.
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7e2ac"/><stop offset="0.55" stop-color="#e6bb63"/><stop offset="1" stop-color="#b8862c"/>
      </linearGradient>
      <mask id="cut"><rect width="48" height="48" fill="#fff"/><circle cx="31" cy="17" r="15.5" fill="#000"/></mask>
    </defs>
    <circle cx="23" cy="24" r="17" fill="url(#lg)" mask="url(#cut)"/>
    <path d="M33 22.5l1.5 3.4 3.4 1.5-3.4 1.5-1.5 3.4-1.5-3.4-3.4-1.5 3.4-1.5z" fill="#fff3d0" opacity=".92"/>
    <circle cx="41" cy="15" r="1.5" fill="#fff3d0" opacity=".75"/>
    <circle cx="37" cy="33" r="1.1" fill="#fff3d0" opacity=".6"/>
  </svg>`;
}

/* ---------------------------------------------------------------- boot */
async function boot(){
  await refresh(true);
  await pollLog();
  const stale = !S.revs_at || S.revs_at.startsWith("0001") || (Date.now() - new Date(S.revs_at).getTime()) > 6 * 3600e3;
  if (stale) refreshRevs(false);   // in the background: the cached list is already usable
}
boot();
setInterval(refresh, 2500);
setInterval(pollLog, 900);
document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) return;
  if (view === "main" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    e.preventDefault(); stepRev(e.key === "ArrowDown" ? 1 : -1); return;
  }
  if (e.key === "Escape" && wiz.step > WELCOME && (S.installs || []).length) finishWizard();
  if (e.key === "Enter" && !e.target.matches("input,select,button")) {
    if (wiz.step === PICK && wiz.rev) wizGo(READY2GO);
    else if (wiz.step === READY2GO) wizInstall();
  }
});
</script>
</body>
