<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCLite launcher</title>
<style>
  :root{
    --bg:#0f0d0b; --bg2:#15120f; --panel:#1a1613; --panel2:#211c18; --panel3:#282218;
    --line:#332c25; --line-soft:#2a2420;
    --text:#ece2d3; --dim:#ac9d88; --dim2:#8d8172;
    --accent:#e6bb63; --accent-dim:#8a6f2f; --good:#8fbf6a; --warn:#d9a75f; --bad:#d9705f;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
    --shadow:0 10px 30px #0008, 0 2px 6px #0006;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 700px at 15% -10%,#241d14 0%,#0f0d0b 55%) fixed;
    color:var(--text);font:14.5px/1.5 system-ui,"Segoe UI",Roboto,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:#e6bb6340}
  *{scrollbar-width:thin;scrollbar-color:#4a4238 transparent}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3f382f;border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#5a5145;background-clip:content-box}
  button{font:inherit;color:var(--text);background:linear-gradient(180deg,#2b241d,#221c17);border:1px solid var(--line);
    border-radius:9px;padding:8px 13px;cursor:pointer;transition:transform .08s ease,border-color .15s,background .15s,box-shadow .15s}
  button:hover:not(:disabled){border-color:#4d4237;background:linear-gradient(180deg,#332a22,#282019)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible,
  .install:focus-visible,.rev:focus-visible,summary:focus-visible{outline:2px solid #e6bb6370;outline-offset:2px}
  button.primary{background:linear-gradient(180deg,#5a4a1c,#3d3418);border-color:#7a6526;color:#fdf1cf;box-shadow:0 1px 0 #ffffff14 inset,0 6px 18px #0004}
  button.primary:hover:not(:disabled){background:linear-gradient(180deg,#6b5822,#4a3f1c);border-color:#a08434}
  button.big{padding:13px 20px;font-size:15.5px;border-radius:11px}
  button.ghost{background:transparent;border-color:var(--line-soft)}
  button.ghost:hover:not(:disabled){background:#ffffff08}
  button.danger{color:var(--bad);border-color:#4a2f2c}
  button.danger:hover:not(:disabled){background:#2a1a18;border-color:#6b3f3a}
  input[type=text],input[type=number],select{font:inherit;font-size:13px;background:#100e0c;color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;transition:border-color .15s}
  input:hover,select:hover{border-color:#463c33}
  label.f{display:block;color:var(--dim);font-size:11px;letter-spacing:.9px;text-transform:uppercase;margin:12px 0 4px}

  /* ---------- shell ---------- */
  .screen{animation:screenIn .28s ease both}
  @keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  header.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:11px 18px;background:#141110ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.3px}
  .brand svg{filter:drop-shadow(0 0 10px #e6bb6355)}
  .brand b{font-weight:600}
  .brand span{color:var(--accent)}
  .meta{color:var(--dim2);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta .dotsep{opacity:.4}
  .spacer{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#1c1815;border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .chip.ok{color:var(--good);border-color:#36462c;background:#182014}
  .chip.bad{color:var(--bad);border-color:#4a2f2c;background:#211413}
  .chip.bad{cursor:pointer}

  /* Left column = set up (revisions, installs, mods) and now carries the most
     content, so it gets the wider track; the right column is two compact cards
     (Server, Join server) that want to stay narrow and tall. */
  main.grid{display:grid;grid-template-columns:minmax(420px,1.12fr) minmax(360px,.88fr);gap:16px;padding:16px;align-items:start}
  @media (max-width:1000px){main.grid{grid-template-columns:1fr}}
  section.panel{background:linear-gradient(180deg,#1c1815,#181512);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  section.panel + section.panel{margin-top:16px}
  /* Collapsed sections keep their header and hide everything else. The header is
     the first child, so one rule covers every panel whatever it holds. */
  section.panel.collapsed > *:not(h2){display:none!important}
  section.panel.collapsed{padding-bottom:11px}
  .panel h2{margin:0 0 3px;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
  .panel h2 .grow{flex:1}
  button.secToggle{background:none;border:none;color:var(--dim2);padding:2px 4px;font-size:11px;line-height:1;border-radius:6px;
    display:inline-flex;align-items:center;gap:5px;letter-spacing:.6px;text-transform:uppercase}
  button.secToggle:hover:not(:disabled){background:#ffffff0d;color:var(--accent)}
  button.secToggle .chev{font-size:9px;transition:transform .15s}
  section.panel.collapsed button.secToggle .chev{transform:rotate(-90deg)}
  .panel .sub{color:var(--dim2);font-size:12px;margin-bottom:10px}
  .empty{color:var(--dim2);font-size:13px;padding:10px 2px}

  /* ---------- revisions: one at a time, stepped with the arrows ---------- */
  .revlist{display:flex;flex-direction:column;gap:7px;max-height:174px;overflow:auto;padding-right:4px;scrollbar-width:thin}
  .revlist.single{max-height:56px;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
  /* flex-shrink would squeeze every row into the one-row window (min-height:auto
     lets it go below the specified height), so rows are pinned at their size. */
  .revlist .rev{flex:0 0 auto}
  .revlist.single .rev{height:56px;min-height:56px;overflow:hidden}
  .revlist.single .rev .tags{flex-wrap:nowrap;overflow:hidden;min-width:0}
  .stepper{display:flex;gap:5px;align-items:center}
  .stepper button{padding:4px 11px;line-height:1.2;font-size:14px;border-radius:8px;background:linear-gradient(180deg,#2f2820,#251f19)}
  .stepper .count{font-family:var(--mono);font-size:11.5px;color:var(--dim2);min-width:54px;text-align:center}
  /* the arrows are the control here, so keep a scrollbar out of the way */
  .revlist.single{scrollbar-width:none}
  .revlist.single::-webkit-scrollbar{width:0;height:0}
  .rev{display:flex;gap:10px;align-items:center;border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px;
    background:linear-gradient(180deg,#1f1b17,#1a1714);transition:border-color .15s;cursor:default}
  .rev:hover{border-color:#4a4034}
  .rev.rec{border-color:#6d5a24;background:linear-gradient(180deg,#26200f,#1c1810)}
  .rev.installed{border-color:#3d4a2e}
  .rev.plain{cursor:default}
  .rev .num{font-family:var(--mono);font-size:15px;font-weight:600;min-width:52px}
  .rev .tags{display:flex;gap:5px;flex-wrap:wrap;min-width:196px}
  .rev .tag{font-size:10.5px;letter-spacing:.4px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim2)}
  .rev .tag.rec{color:#f2d79a;border-color:#6d5a24;background:#2a2210}
  .rev .tag.ok{color:var(--good);border-color:#36462c}
  .rev .tag.mods{color:var(--accent);border-color:#5b4a20}
  .rev .tag.off{opacity:.65}
  .rev .grow{flex:1}

  /* ---------- installs ---------- */
  .install{border:1px solid var(--line-soft);border-radius:10px;padding:9px 10px;
    background:#1c1916;cursor:pointer;transition:border-color .15s,background .15s}
  .install .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .install .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .install .acts{display:flex;gap:6px;opacity:.62;transition:opacity .15s;margin-left:6px;padding-left:8px;border-left:1px solid var(--line-soft)}
  .install:hover .acts,.install.on .acts{opacity:1}
  .install .acts button{padding:4px 9px;font-size:11.5px}
  .install:hover{background:#221e1a}
  .install.on{border-color:#7a6526;background:linear-gradient(180deg,#26200f,#1d1913)}
  .install .name{font-family:var(--mono);font-size:13.5px}
  .install .path{font-family:var(--mono);font-size:11px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.good{color:var(--good);border-color:#36462c}
  .pill.mods{color:var(--accent);border-color:#5b4a20}

  /* ---------- cards in detail ---------- */
  .card{border:1px solid var(--line-soft);border-radius:11px;padding:12px;background:var(--panel2);margin-bottom:10px}
  .card:last-child{margin-bottom:0}
  .card.selcard{border-left:3px solid var(--accent-dim)}
  .card .cap{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
  .card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
  .card h3 .grow{flex:1}
  .path{font-family:var(--mono);font-size:11.5px;color:var(--dim2);word-break:break-all}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrap{flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{color:var(--dim2);font-size:12px;margin-top:8px;line-height:1.55}
  details.block{border-top:1px solid var(--line-soft);margin-top:12px;padding-top:10px}
  details.block > summary{cursor:pointer;color:var(--dim);font-size:12.5px;list-style:none;display:flex;align-items:center;gap:7px}
  details.block > summary::-webkit-details-marker{display:none}
  details.block > summary:before{content:"+";color:var(--accent);font-family:var(--mono);width:10px}
  details.block[open] > summary:before{content:"–"}
  details.block > summary:hover{color:var(--text)}
  details.block .inner{padding-top:10px}
  .note{color:var(--warn);font-size:12px;margin-top:8px}
  .status{display:flex;gap:9px;align-items:center;font-size:13px;min-height:22px}
  .dot{width:9px;height:9px;border-radius:50%;background:#5c5145;flex:0 0 auto}
  .dot.live{background:var(--good);box-shadow:0 0 10px #8fbf6a99}
  .dot.busy{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .modrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #2b2621}
  .modrow:last-child{border-bottom:none}
  .modrow input[type=checkbox]{margin-top:3px;accent-color:#c9a44f;width:15px;height:15px}
  /* required mods are always on, so they get a locked tick rather than a
     disabled checkbox — a dimmed box reads as "not included" */
  .modcheck{width:15px;height:15px;margin-top:3px;border-radius:4px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(180deg,#d3ab55,#a98531);color:#241d0e;font-size:11px;font-weight:700;
    box-shadow:0 0 0 1px #6b5a2488}
  .modrow.req .mname::after{content:" · required";color:var(--accent)}
  .modrow.off{opacity:.5}
  .modrow.off .modcheck{cursor:default}
  button.primary.dirty{animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 0 1px #e6bb6366,0 0 16px #e6bb6333}}
  .modrow .mname{font-size:13px}
  .modrow .mdesc{color:var(--dim2);font-size:11.5px}
  .modlist{overflow:visible;padding-right:6px}
  .modlist .more{color:var(--dim2);font-size:11.5px;padding-top:6px;text-align:center}

  /* ---------- console ---------- */
  .console{margin:0 16px 16px;border:1px solid var(--line);border-radius:var(--radius);background:#0b0908;overflow:hidden;box-shadow:var(--shadow)}
  .console .head{display:flex;gap:8px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);background:#141110;font-size:12px}
  .tab{padding:4px 10px;border-radius:7px;border:1px solid transparent;color:var(--dim2);cursor:pointer;font-size:11.5px}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text);border-color:#4a4034;background:#221d18}
  .body{font-family:var(--mono);font-size:11.8px;line-height:1.55;padding:10px 12px;height:230px;overflow:auto;white-space:pre-wrap;color:#c9bfb0}
  .body .err{color:var(--bad)} .body .step{color:var(--accent)} .body .cmd{color:#7fa6c8} .body .ok{color:var(--good)}
  .console.min .body{height:0;padding:0 12px}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:380px}
  .toast{background:#221d17f2;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
    padding:10px 13px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .22s ease both}
  .toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)}
  @keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

  /* ---------- onboarding wizard ---------- */
  #wizard{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px 60px}
  .wcard{width:min(800px,100%);background:linear-gradient(180deg,#1d1916,#161311);border:1px solid var(--line);
    border-radius:18px;padding:26px 30px 24px;box-shadow:0 30px 80px #000a,0 2px 0 #ffffff08 inset;position:relative;overflow:hidden}
  .wcard:before{content:"";position:absolute;inset:-40% 40% 60% -30%;background:radial-gradient(closest-side,#e6bb6314,transparent);pointer-events:none}
  .steps{display:flex;gap:7px;margin:0 0 20px;position:relative}
  .steps i{width:26px;height:4px;border-radius:99px;background:#4b433a;transition:background .3s,width .3s;display:block}
  .steps i.on{background:linear-gradient(90deg,var(--accent),#f0d493);width:42px}
  .steps i.done{background:#b9902f}
  .whero{display:flex;align-items:flex-start;gap:15px;margin-bottom:6px}
  .whero svg{flex:0 0 auto;margin-top:3px}
  .wcols{display:grid;grid-template-columns:1.12fr .88fr;gap:26px;align-items:start}
  @media (max-width:700px){.wcols{grid-template-columns:1fr;gap:18px}}
  .aside{border:1px solid var(--line-soft);border-radius:14px;padding:15px 16px;background:linear-gradient(180deg,#1e1a16,#191613)}
  .aside h5{margin:0 0 10px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
  .aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .aside li{font-size:13px;color:var(--text);display:flex;gap:9px;align-items:center}
  .aside li span.i{width:22px;text-align:center;opacity:.95}
  .aside .foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);color:var(--dim2);font-size:11.5px;line-height:1.6}
  .wtitle{font-size:26px;font-weight:600;letter-spacing:.2px;margin:0 0 6px}
  .wlede{color:var(--dim);font-size:14.5px;margin:0 0 20px;max-width:58ch}
  .wfoot{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .wfoot .spacer{flex:1}
  .choice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line-soft);border-radius:14px;padding:16px;
    background:#1c1916;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;text-align:left;width:100%}
  .choice:hover{border-color:#5c4f3f;background:#221e1a;transform:translateY(-1px)}
  .choice .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#241f18;border:1px solid var(--line);flex:0 0 auto}
  .choice h4{margin:0 0 3px;font-size:15px}
  .choice p{margin:0;color:var(--dim2);font-size:12.5px;line-height:1.5}
  .choice + .choice{margin-top:10px}
  .revecard{display:flex;gap:12px;align-items:center;border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;
    background:#1b1815;cursor:pointer;transition:border-color .15s,background .15s}
  .revecard + .revecard{margin-top:8px}
  .revecard:hover{border-color:#514636;background:#211d19}
  .revecard.on{border-color:#9c8129;background:linear-gradient(180deg,#302710,#211b10);
    box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px #8a722944,0 8px 22px #0005}
  .revecard .n{font-family:var(--mono);font-size:20px;font-weight:600;min-width:64px}
  .revecard .t{font-size:12px;color:var(--dim2)}
  .revecard .grow{flex:1}
  .revecard .tick{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:transparent}
  .revecard.on .tick{background:var(--accent);border-color:var(--accent);color:#2a2213}
  .revscroll{max-height:220px;overflow:auto;padding-right:10px;scrollbar-width:thin}
  .footpath{color:var(--dim2);font-size:11.5px;font-family:var(--mono);max-width:34ch;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  details.more summary{color:var(--dim);cursor:pointer;font-size:12.5px}
  details.more summary:hover{color:var(--accent)}
  details.more .body{color:var(--dim2);font-size:12px;margin-top:8px;line-height:1.7}
  .phases{display:flex;flex-direction:column;gap:9px;margin:6px 0 4px}
  .phase{display:flex;gap:11px;align-items:center;color:var(--dim2);font-size:13.5px;transition:color .2s}
  .phase .mark{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
  .phase.active{color:var(--text)}
  .phase.active .mark{border-color:var(--accent);color:var(--accent);animation:spin 1.1s linear infinite;border-top-color:transparent;border-right-color:transparent}
  .phase.done{color:var(--dim)}
  .phase.done .mark{border-color:#3d4a2e;color:var(--good)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .peek{margin-top:12px;background:#0d0b09;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;
    font-family:var(--mono);font-size:11.4px;color:#a89c8c;max-height:92px;overflow:auto;white-space:pre-wrap}
  .wcheck{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .wcheck span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--dim);background:#1b1815}
  .kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .linky{background:none;border:none;color:var(--dim);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
  .linky:hover{color:var(--accent)}
  .skeleton{height:120px;border-radius:12px;background:linear-gradient(90deg,#1b1815,#221e1a,#1b1815);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
  .sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---- worlds ---------------------------------------------------------------
     A world is a card, not a row: it carries a name, a description, a mod policy
     and a host identity, and the reader has to be able to tell "signed by someone
     I have seen before" from "unsigned stranger" at a glance. The left border is
     that signal — gold for a verified signature, dim for unsigned — the same way
     .selcard marks the selected install. */
  .worldcard{border:1px solid var(--line-soft);border-radius:11px;padding:11px 12px;background:var(--panel2);margin-bottom:9px;
    border-left:3px solid var(--line)}
  .worldcard:last-child{margin-bottom:0}
  .worldcard.self{border-left-color:var(--accent);background:linear-gradient(180deg,#241d14,#1e1a16)}
  .worldcard.signed{border-left-color:var(--accent-dim)}
  .worldcard.unsigned{border-left-color:#5a4a3a}
  .worldcard.offline{opacity:.62}
  .worldcard.offline.fav{opacity:.85}
  .worldcard h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .worldcard h4 .grow{flex:1}
  .worldcard .wdesc{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.5}
  .worldcard .wmeta{color:var(--dim2);font-size:11.5px;margin-top:7px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .worldcard .wmeta .mono{font-family:var(--mono)}
  .worldcard .acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .worldcard .acts .grow{flex:1}
  .wstar{background:none;border:none;padding:2px 4px;font-size:15px;line-height:1;color:var(--dim2);cursor:pointer}
  .wstar:hover:not(:disabled){color:var(--accent);background:none}

  .wtag.req{color:var(--warn);border-color:#4a3d2c}
  .wtag.ok{color:var(--good);border-color:#36462c}
  .wtag.self{color:var(--accent);border-color:var(--accent-dim)}
  .wmods{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .gate{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px;background:#1b1714}
  .gate.block{border-color:#4a2f2c;background:#211413}
  .gate.warn{border-color:#4a3d2c;background:#201b13}
  .gate h4{margin:0 0 5px;font-size:13px}
  .gate.block h4{color:var(--bad)}
  .gate.warn h4{color:var(--warn)}

  .codebox{font-family:var(--mono);font-size:10.5px;color:#a89c8c;background:#0d0b09;border:1px solid var(--line-soft);
    border-radius:9px;padding:9px 10px;max-height:88px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="root"><div style="padding:60px"><div class="skeleton" style="width:min(760px,100%);margin:0 auto"></div></div></div>

<script>
const TOKEN = "__LCLITE_TOKEN__";
let S = null, sel = null, view = "auto", logWhich = "job", busyJob = null;
let cursors = { job: 0, server: 0, proxy: 0 }, mainLog = [];
let wiz = { step: 0, rev: null, path: "", jobId: null, phase: -1, error: "", mode: "fresh" };
let folder = "";
// Section signatures: a poll must never stomp on what you're doing (tick boxes,
// typed ports, a selected checkbox), so each block re-renders only when the
// data behind it actually changed.
let sig = { revs: "", installs: "", mods: "", worlds: "" };
// How many mod rows show while the mod list is folded (the list is a fold of its
// own, inside the LCLite mods section).
const MOD_PREVIEW = 2;
let modsOpen = false;
// Sections folded away, adopted from /api/state on the first render. The local
// set is what renders — the 2.5s poll must never flip a panel back under you.
let collapsed = null;

/* ---------------------------------------------------------------- plumbing */
async function api(path, body) {
  const opt = { headers: { "X-LCLite-Token": TOKEN }, method: body === undefined ? "GET" : "POST" };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch("/api/" + path, opt);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (data && data.ok === false) throw new Error(data.error || "request failed");
  return data;
}
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function mb(bytes){ return bytes ? (bytes/1048576).toFixed(1) + " MB" : ""; }
function ago(ts){
  if (!ts || ts.startsWith("0001")) return "";
  const d = (Date.now() - new Date(ts).getTime()) / 1000;
  if (isNaN(d)) return "";
  if (d < 90) return "just now";
  if (d < 3600) return Math.round(d/60) + " min ago";
  if (d < 86400) return Math.round(d/3600) + " h ago";
  const days = Math.round(d/86400);
  return days === 1 ? "yesterday" : days + " days ago";
}
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(10px)"; el.style.transition = "all .25s"; }, 4200);
  setTimeout(() => el.remove(), 4600);
}
async function act(fn, label, quiet){
  try { return await fn(); }
  catch (e) { if (!quiet) toast((label ? label + ": " : "") + e.message, "bad"); mainLog.push(["err", "!! " + e.message]); throw e; }
}

/* ---------------------------------------------------------------- state */
async function refresh(first){
  try { S = await api("state"); }
  catch (e) { if (first) setTimeout(() => refresh(true), 1500); return; }
  render();
}
async function refreshRevs(force){
  if (force) toast("Reading the Lost City branch lists…");
  try {
    const r = await api("revs");
    if (r.note) toast(r.note, "bad");
    await refresh();
  } catch (e) { toast("Could not read the branch lists: " + e.message, "bad"); }
}

/* ---------------------------------------------------------------- render */
// The wizard is a place you go, not a condition that can flip under you: once
// the setup starts, the install showing up in state must not yank the screen
// away mid-progress. So the view is decided once and then only changed by you.
function decideView(){
  if (view !== "auto") return;
  const fresh = (S.installs || []).length === 0 && !S.skip_wizard;
  view = fresh ? "wizard" : "main";
  // Land on something: the last revision used, else the first install.
  if (view === "main" && !sel && (S.installs || []).length) {
    const pick = (S.installs || []).find(i => i.rev_label === S.last_rev) || (S.installs || [])[0];
    sel = pick.id;
  }
  // Reloading the page during a setup? Pick the install back up where it is.
  const job = S.job;
  if (view === "wizard" && job && job.status === "running" && ["install", "mods", "build"].includes(job.kind)) {
    wiz.step = INSTALLING;
    wiz.rev = job.install_id || wiz.rev;
    wiz.phase = phaseOf(job.step, job.lines || []);
    busyJob = job.id;
    cursors.job = 0;
  }
}

function render(){
  if (!S) return;
  decideView();
  // Sections the user folded away live in launcher.json; adopt them once.
  if (collapsed === null) collapsed = new Set(S.collapsed || []);
  const showWizard = view === "wizard";
  const want = showWizard ? "wizard" : "main";
  if ($("root").dataset.view !== want) {
    $("root").dataset.view = want;
    sig = { revs: "", installs: "", mods: "", worlds: "" };
    sigWiz = "";
    // The whole dashboard is being rebuilt, so the host form's "already filled"
    // flag has to go with it — otherwise a view flip leaves empty inputs behind.
    worldsFilled = false;
    $("root").innerHTML = showWizard ? wizardHTML() : mainHTML();
    if (showWizard) renderWizard(); else { renderMain(true); wireRevScroll(); loadWorlds(); }
    applySections();
    return;
  }
  if (showWizard) renderWizard(); else renderMain(false);
}

/* ---- collapsible sections -------------------------------------------------- */
// Folded-away sections are remembered in launcher.json, not localStorage: the UI
// port is random per run, so a browser-side preference would reset every launch.
function secToggle(key){
  return `<button class="secToggle" data-sec-toggle="${key}" onclick="toggleSection('${key}')" aria-expanded="true"
    title="fold this section away"><span class="lab">Hide</span><span class="chev">▼</span></button>`;
}

function applySections(){
  if (!collapsed) return;
  document.querySelectorAll("section.panel[data-sec]").forEach(sec => {
    const off = collapsed.has(sec.dataset.sec);
    sec.classList.toggle("collapsed", off);
    const btn = sec.querySelector(".secToggle");
    if (!btn) return;
    btn.setAttribute("aria-expanded", off ? "false" : "true");
    btn.title = off ? "show this section" : "fold this section away";
    const lab = btn.querySelector(".lab");
    if (lab) lab.textContent = off ? "Show" : "Hide";
  });
}

function toggleSection(key){
  if (!collapsed) collapsed = new Set();
  if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
  applySections();
  api("config", { collapsed: [...collapsed] }).catch(e => toast("Could not remember that: " + e.message, "bad"));
}

// Folding the mod list is a view change only: what is ticked lives in modPick, so
// uncommitted ticks survive it (and stay counted).
function toggleModList(){
  modsOpen = !modsOpen;
  const el = $("mods");
  if (el) { el.innerHTML = modsHTML(); refreshModsDirty(); }
}

/* ================================ THE WIZARD ============================= */
const WELCOME = 0, PICK = 1, READY2GO = 2, INSTALLING = 3, DONE = 4;

function wizardHTML(){
  return `<div id="wizard" class="screen"><div class="wcard">
    <div class="steps">${[WELCOME,PICK,READY2GO,INSTALLING,DONE].map(i =>
      `<i class="${wiz.step === i ? "on" : (wiz.step > i ? "done" : "")}"></i>`).join("")}</div>
    <div id="wbody"></div>
  </div></div>`;
}

let sigWiz = "";
function renderWizard(){
  const b = $("wbody");
  if (!b) return;
  // Pressing Start at the end of setup is the last step, not a dead end: once the
  // world answers, move the user on to the launcher itself (after a beat, so the
  // "your world is up" state is visible).
  if (wiz.step === DONE && wiz.autoFinish && !wiz.leaving && S.engine && S.engine.state === "running") {
    wiz.leaving = true;
    setTimeout(() => {
      toast("Here's the launcher — your world is running on the Server panel.", "good");
      finishWizard(true);
    }, 2200);
  }
  // The progress dots live in the static shell, so they are not rebuilt with the
  // step body — update them here or they silently stick on step one.
  document.querySelectorAll(".steps i").forEach((el, i) => {
    el.className = wiz.step === i ? "on" : (wiz.step > i ? "done" : "");
  });
  // Don't rebuild the wizard on every poll: only when something it shows changed.
  // (Live phase ticks are done in place by renderPeek.)
  const s = [wiz.step, wiz.rev, wiz.error, (S.revs || []).length, (S.installs || []).length,
             S.recommended, S.engine && S.engine.state, (S.overlay_revs || []).join(",")].join("|");
  if (s === sigWiz) return;
  sigWiz = s;
  const rec = (S.revs || []).find(r => r.recommended) || (S.revs || [])[0];
  switch (wiz.step) {
    case WELCOME: {
      const modsRev = overlayRevs()[0];
      b.innerHTML = `
        <div class="wcols">
          <div>
            <div class="whero">
              ${logo(52)}
              <div>
                <h1 class="wtitle">Welcome to LCLite.</h1>
                <p class="wlede" style="margin-bottom:0">A mod layer for the Lost City webclient, with a launcher that
                does the setup for you. Pick a revision and it fetches, builds and opens the game — no terminal, no
                hand-merging.</p>
              </div>
            </div>
            <div class="chips" style="margin:16px 0 20px">
              <span class="chip">${mb(S.binary_size)} · no runtime</span>
              <span class="chip">${(S.revs || []).length} revisions available</span>
              <span class="chip">nothing sent anywhere</span>
            </div>
            <div class="row" style="gap:10px;flex-wrap:wrap">
              <button class="primary big" onclick="wizGo(${PICK})">Set up a revision&nbsp; →</button>
              <button class="big ghost" onclick="wizCustom()">Use an existing install</button>
            </div>
            <div style="margin-top:13px"><button class="linky" onclick="wizSkip()">Skip setup — show me the full launcher</button></div>
          </div>
          <aside class="aside">
            <h5>What you get</h5>
            <ul>
              <li><span class="i">☾</span>OSRS-style camera: zoom, rotate, chat scroll</li>
              <li><span class="i">📈</span>XP drops and a level tracker</li>
              <li><span class="i">🔮</span>HP / prayer / energy orbs</li>
              <li><span class="i">🟩</span>True tile, roofs off, low detail</li>
              <li><span class="i">🃏</span>TCG card packs, ${"6,376"} collectibles</li>
            </ul>
            <div class="foot">Mods live in one overlay you can switch off any time. They're written for revision
            <b>${esc(modsRev)}</b> and ported to ${overlayRevs().length > 1 ? "the other revisions this build supports" : "it alone"} — pick any of
            <b>${overlayRevs().map(esc).join(", ")}</b> and the same mods come with it.</div>
          </aside>
        </div>`;
      break;
    }
    case PICK: {
      const playable = (S.revs || []).filter(r => r.engine && r.content);
      const rest = (S.revs || []).filter(r => !(r.engine && r.content));
      if (!wiz.rev && rec) wiz.rev = rec.name;
      b.innerHTML = `
        <h1 class="wtitle">Which Lost City revision would you like to use?</h1>
        <p class="wlede">${rec ? `<b>${esc(rec.name)}</b> is the one Lost City is developing right now${S.recommended_updated ? ` (content updated ${ago(S.recommended_updated)})` : ""} — pick it unless you want to visit an older moment in the game's history.` : "Pick a revision to install."}</p>
        <div class="revscroll">
          ${playable.map(r => {
            const on = r.name === wiz.rev;
            const mods = hasMods(r.name);
            return `<div class="revecard ${on ? "on" : ""}" tabindex="0" role="radio" aria-checked="${on}" onclick="wizPick('${esc(r.name)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();wizPick('${esc(r.name)}')}">
              <div class="n">${esc(r.name)}</div>
              <div class="grow">
                <div>${r.recommended ? "Recommended" : "Lost City revision"} ${r.client ? "" : "<span class='t'>(server + content only)</span>"}</div>
                <div class="t">${mods ? "LCLite mods available — camera, XP drops, orbs, true tile, TCG" : "vanilla upstream client, no LCLite mods yet (the overlay supports " + overlayRevs().map(esc).join(", ") + ")"}</div>
              </div>
              <div class="tick">✓</div>
            </div>`;
          }).join("")}
        </div>
        ${rest.length ? `<details class="more" style="margin-top:14px"><summary>More branches — client-only work (${rest.length})</summary>
          <div class="body">${rest.map(r => esc(r.name)).join(" · ")}<br>These have no matching server content, so they can't be installed here.</div></details>` : ""}
        <div class="wfoot">
          <button class="ghost" onclick="wizGo(${WELCOME})">Back</button>
          <span class="spacer"></span>
          <span class="footpath" title="${esc(S.data_dir)}">${wiz.rev ? "installs to " + esc(S.data_dir) : "pick a revision to continue"}</span>
          <button class="primary" ${wiz.rev ? "" : "disabled"} onclick="wizGo(${READY2GO})">Continue →</button>
        </div>`;
      break;
    }
    case READY2GO: {
      const mods = hasMods(wiz.rev);
      b.innerHTML = `
        <h1 class="wtitle">What you're getting</h1>
        <p class="wlede">Revision <b>${esc(wiz.rev || "")}</b>, built on your machine.</p>
        <div class="card">
          <h3>We will</h3>
          <div class="phases" style="margin:2px 0 0">
            <div class="phase"><span class="mark">↓</span>Download the Lost City client, engine and content at ${esc(wiz.rev || "")}</div>
            <div class="phase"><span class="mark">⚙</span>Install the server's dependencies (~1 min)</div>
            <div class="phase"><span class="mark">✦</span>${mods ? "Apply the LCLite mods and build your client" : "Build the client bundle"}</div>
          </div>
        </div>
        ${mods ? `<div class="card">
          <h3>LCLite comes along <span class="grow"></span><span class="pill mods">on by default</span></h3>
          <div class="wcheck">
            <span>☾ OSRS camera</span><span>📈 XP drops</span><span>🔮 Stat orbs</span><span>🟩 True tile</span>
            <span>🃏 TCG packs</span><span>🚀 GPU (beta)</span><span>⚙ F1 panel</span>
          </div>
          <div class="hint">Everything is a toggle afterwards — the F1 panel in-game, or this launcher's mod list.</div>
        </div>` : `<div class="note">Heads up: the overlay has no corpus for revision ${esc(wiz.rev || "")} yet, so this revision installs vanilla. Mods are available on ${overlayRevs().map(esc).join(", ")} — you can install one of those later from the launcher.</div>`}
        <div class="hint">Around ${mods ? "1–3" : "1–2"} minutes on a normal connection. Everything stays in <span class="path">${esc(S.data_dir)}</span>.</div>
        <div class="wfoot">
          <button class="ghost" onclick="wizGo(${PICK})">Back</button>
          <span class="spacer"></span>
          <button class="primary big" onclick="wizInstall()">Install &amp; build →</button>
        </div>`;
      break;
    }
    case INSTALLING: {
      const phases = ["Fetching Lost City", "Installing what the server needs", hasMods(wiz.rev) ? "Applying LCLite mods & building" : "Building the client", "Ready to play"];
      b.innerHTML = `
        <h1 class="wtitle">Setting up ${esc(wiz.rev || "")}…</h1>
        <p class="wlede">Sit back — this part is just downloading and compiling. It only happens once per revision.</p>
        ${wiz.error ? `
          <div class="card" style="border-color:#5a3630;background:linear-gradient(180deg,#241816,#1d1413)">
            <h3 style="color:var(--bad)">Setup stopped</h3>
            <div class="hint" style="color:var(--text)">${esc(wiz.error)}</div>
            <div class="row wrap" style="margin-top:12px">
              <button class="primary" onclick="wizInstall()">Try again</button>
              <button onclick="wizGo(${READY2GO})">Back</button>
              <button onclick="finishWizard()">Open the full launcher</button>
            </div>
            <div class="hint">The full log is in the console below.</div>
          </div>`
        : `<div class="phases">${phases.map((p, i) => `
            <div class="phase ${wiz.phase === i ? "active" : (wiz.phase > i ? "done" : "")}">
              <span class="mark">${wiz.phase > i ? "✓" : (wiz.phase === i ? "" : i + 1)}</span>${p}</div>`).join("")}
          </div>
          <div class="peek" id="peek"></div>
          <div class="wfoot">
            <span class="t" style="color:var(--dim2);font-size:12px">Working…</span>
            <span class="spacer"></span>
            <button class="ghost" onclick="openConsoleNow()">Full log →</button>
          </div>`}`;
      break;
    }
    case DONE: {
      const inst = (S.installs || []).find(i => i.rev_label === wiz.rev) || (S.installs || [])[0];
      const eng = S.engine || {};
      b.innerHTML = `
        <div class="whero">
          <div style="width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#1f2a17;border:1px solid #3d4a2e;color:var(--good);font-size:24px">✓</div>
          <div>
            <h1 class="wtitle">You're ready.</h1>
            <p class="wlede" style="margin:0">${esc(wiz.rev || "")} is installed and built. Press Start to launch the world and open the client —
            and the launcher itself opens once your world is up.</p>
          </div>
        </div>
        <div class="card">
          <div class="status"><span class="dot ${eng.state === "running" ? "live" : eng.state === "starting" ? "busy" : ""}"></span>
          ${eng.state === "running" ? `World is up — <a href="http://localhost${eng.port == 80 ? "" : ":" + eng.port}/rs2.cgi" target="_blank">open the client</a>`
            : eng.state === "starting" ? "Starting the world…" : "No world running yet"}</div>
          <div class="row wrap" style="margin-top:12px;align-items:flex-end">
            ${eng.state === "running"
              ? `<button class="primary big" onclick="openClient()">Open the client →</button><button onclick="stopServer()">Stop the world</button>`
              : `<button class="primary big" onclick="playFromWizard()">Start ${esc(wiz.rev || "")} →</button>
                 <div style="max-width:120px"><label class="f" style="margin-top:0">Web port</label>
                   <input type="number" id="wizport" min="1" max="65535" value="${eng.port || 80}"></div>`}
          </div>
          <div class="hint">First boot repacks the game cache, so give it a minute — progress and the full log live in the launcher's console.</div>
        </div>
        <div class="wfoot">
          <button class="ghost" onclick="wizGo(${PICK})">Install another revision</button>
          <span class="spacer"></span>
          <button onclick="finishWizard()">Open the launcher now</button>
        </div>`;
      break;
    }
  }
}

function wizGo(step){ wiz.step = step; wiz.error = ""; wiz.leaving = false; render(); }
function wizPick(rev){ wiz.rev = rev; render(); }
function wizCustom(){ wiz.mode = "custom"; pickFolder(true); }
async function wizSkip(){ await act(() => api("config", { skip_wizard: true }), "config", true); view = "main"; await refresh(); }
async function finishWizard(quiet){
  if (wiz.mode !== "custom") await act(() => api("config", { skip_wizard: true }), "config", true);
  view = "main";
  const inst = (S.installs || []).find(i => i.rev_label === wiz.rev);
  if (inst) sel = inst.id;
  await refresh();
  if (!quiet) toast("Launcher unlocked — revisions, mods and custom servers are in the full view.", "good");
}
async function wizInstall(){
  wiz.step = INSTALLING; wiz.phase = 0; wiz.error = ""; render();
  try {
    const r = await api("install", { rev: wiz.rev, client: true, overlay: hasMods(wiz.rev) });
    busyJob = r.job; cursors.job = 0;
    const job = await waitForJob(r.job);
    if (job.status !== "ok") { wiz.error = job.err || "install failed"; render(); return; }
    wiz.phase = 3;
    sel = wiz.rev;
    await refresh();
    setTimeout(() => { wiz.step = DONE; render(); }, 550);
  } catch (e) {
    wiz.error = e.message; render();
  }
}
async function waitForJob(id){
  for (;;) {
    const r = await api("job?id=" + encodeURIComponent(id) + "&since=" + cursors.job).catch(() => null);
    const job = r && r.job;
    if (!job) { await new Promise(s => setTimeout(s, 700)); continue; }
    for (const ln of job.lines || []) {
      cursors.job = Math.max(cursors.job, ln.n + 1);
      pushLog(classify(ln.text), ln.text);
    }
    if (wiz.step === INSTALLING) {
      const p = phaseOf(job.step, job.lines || []);
      if (p > wiz.phase) wiz.phase = p;
      renderPeek();
    }
    if (job.status !== "running") return job;
    await new Promise(s => setTimeout(s, 700));
  }
}
function phaseOf(step, lines){
  const s = (step || "").toLowerCase();
  let p = 0;
  if (/dependenc|npm install/.test(s)) p = 1;
  if (/mod|build|bundle/.test(s)) p = 2;
  return p;
}
function renderPeek(){
  const peek = $("peek");
  if (!peek) return;
  const tail = mainLog.slice(-4).map(l => l[1]).join("\n");
  peek.textContent = tail || "…";
  peek.scrollTop = peek.scrollHeight;
  // phase markers without a full re-render (keeps the spinner smooth)
  document.querySelectorAll("#wbody .phase").forEach((el, i) => {
    el.className = "phase " + (wiz.phase === i ? "active" : (wiz.phase > i ? "done" : ""));
    const m = el.querySelector(".mark");
    if (m) m.textContent = wiz.phase > i ? "✓" : (wiz.phase === i ? "" : String(i + 1));
  });
}

/* ================================ FULL VIEW ============================== */
function mainHTML(){
  // Tool names/versions come straight from --version, so strip the tool's own
  // name ("git version 2.53" / "bun 1.4.2") before showing it.
  const toolList = (S.tools || []).map(t => {
    let v = (t.version || "").replace(/^v/, "");
    if (t.name === "git") v = v.replace(/^git version\s*/i, "");
    if (t.name === "bun") v = v.replace(/^bun\s*/i, "").replace(/^v/, "");
    return { ...t, clean: v };
  });
  const missing = toolList.filter(t => !t.ok);
  // Diagnostic info stays quiet unless it needs you: one chip when everything is
  // there, a clickable one per missing tool when it isn't.
  const tools = toolList.length
    ? (missing.length
        ? missing.map(t => `<span class="chip bad" ${t.name === "bun" ? `onclick="installBun()"` : ""} title="${esc(t.hint || "")}${t.name === "bun" ? " — click to fetch it" : ""}">✗ ${esc(t.name)}</span>`).join("")
        : `<button class="ghost" style="padding:3px 10px;font-size:11.5px" title="click for versions" onclick="showTools()">tools ✓</button>`)
    : "";
  return `
  <div class="screen">
    <header class="top">
      <div class="brand">${logo(22)}<div><b>LCLite</b> <span>launcher</span></div></div>
      <div class="meta">
        <span>v${esc(S.version)}</span><span class="dotsep">·</span>
        <span title="the entire launcher">${mb(S.binary_size)} single file</span>
      </div>
      <span class="spacer"></span>
      <span class="chips">${tools}</span>
      <button class="ghost" onclick="refreshRevs(true)">Refresh branches</button>
      <button class="ghost" onclick="openWizardAgain()">Setup guide</button>
      <button class="ghost" onclick="quitLauncher()">Quit</button>
    </header>

    <main class="grid">
      <div>
        <section class="panel" data-sec="revs">
          <h2>Lost City revisions<span class="grow"></span>
            <span class="stepper">
              <button id="revup" aria-label="previous revision" title="previous revision (or ↑)" onclick="stepRev(-1)">▲</button>
              <span class="count" id="revcount">1 / ${(S.revs || []).length}</span>
              <button id="revdown" aria-label="next revision" title="next revision (or ↓)" onclick="stepRev(1)">▼</button>
            </span>${secToggle("revs")}</h2>
          <div class="sub">${S.revs_at ? "last checked " + ago(S.revs_at) : "from the Lost City repos"} · install a revision here; ones you already have are marked, and live in the list below</div>
          <div class="revlist single" id="revlist">${revRows()}</div>
        </section>

        <section class="panel" data-sec="installs">
          <h2>Installs<span class="grow"></span>
            ${(S.installs || []).length ? `<span class="chip ok">${(S.installs || []).length} installed</span>` : ""}${secToggle("installs")}</h2>
          <div class="sub">your installed revisions — pick one and its mods appear below</div>
          <div id="installs">${installRows()}</div>
          <div id="installcard">${installCardHTML()}</div>
          <details class="block">
            <summary>Use an existing folder instead</summary>
            <div class="inner">
              <div class="path" id="importpath">${folder ? esc(folder) : "no folder picked yet"}</div>
              <div class="row" style="margin-top:9px">
                <button onclick="pickFolder()">Browse…</button>
                <button class="primary" ${folder ? "" : "disabled"} onclick="importFolder()">Add it</button>
              </div>
              <div class="hint">Any folder holding <b>webclient/</b> and <b>engine/</b> works. With <b>lclite/</b> inside it on revision ${esc(overlayRevs().join(" / "))}, mods are offered too.</div>
            </div>
          </details>
        </section>

        <section class="panel" data-sec="mods">
          <h2>LCLite mods<span class="grow"></span>${secToggle("mods")}</h2>
          <div id="mods">${modsHTML()}</div>
        </section>
      </div>

      <div>
        <section class="panel" data-sec="server">
          <h2>Server<span class="grow"></span><span class="chip" style="text-transform:none;letter-spacing:0">this machine</span>${secToggle("server")}</h2>
          ${serverHTML()}
        </section>

        <section class="panel" data-sec="join">
          <h2>Join server<span class="grow"></span><span class="chip" style="text-transform:none;letter-spacing:0">somewhere else</span>${secToggle("join")}</h2>
          ${joinHTML()}
        </section>

        <section class="panel" data-sec="worlds">
          <h2>Worlds<span class="grow"></span><span class="chip" style="text-transform:none;letter-spacing:0">player hosted</span>${secToggle("worlds")}</h2>
          <div class="sub" id="worldssub">worlds you have been invited to — kept on this machine</div>
          <div id="worlds"><div class="skeleton"></div></div>
          <div id="worldgate"></div>
          ${worldToolsHTML()}
        </section>
      </div>
    </main>

    <div class="console" id="console">
      <div class="head">
        <div class="row" style="gap:4px">
          <div class="tab on" data-which="job" onclick="setLog('job')">Task</div>
          <div class="tab" data-which="server" onclick="setLog('server')">Server</div>
          <div class="tab" data-which="proxy" onclick="setLog('proxy')">Bridge</div>
        </div>
        <span class="spacer"></span>
        <span class="meta" id="jobstatus"></span>
        <button class="ghost" onclick="clearLog()">Clear</button>
        <button class="ghost" onclick="toggleConsole()">Hide</button>
      </div>
      <div class="body" id="logbody"></div>
    </div>
  </div>`;
}

// Which revisions the overlay in this launcher has a corpus for. The server reads it
// from the overlay's revs.json (overlay_revs); a mods chip and the wizard's install
// request both come from here, so there is exactly one answer to "does this rev come
// with mods?".
function overlayRevs(){
  const list = (S.overlay_revs || []).filter(Boolean);
  return list.length ? list : [S.overlay_rev || "289"];
}
function hasMods(rev){ return overlayRevs().includes(String(rev)); }

function revRows(){
  const installed = new Map((S.installs || []).map(i => [i.rev_label || i.id, i]));
  const rank = r => r.recommended ? 0 : ((r.engine && r.content) ? 1 : 2);
  const num = n => { const m = String(n).match(/^[0-9.]+/); return m ? parseFloat(m[0]) : -1; };
  const order = (S.revs || []).slice().sort((a, b) =>
    rank(a) - rank(b) || num(b.name) - num(a.name) || String(a.name).localeCompare(String(b.name)));
  return order.map(r => {
    const have = installed.get(r.name);
    const playable = r.engine && r.content;
    // Ordered by what matters most: a one-row window can clip the tail, so the
    // tooltip carries the full story.
    const tags = [];
    if (r.recommended) tags.push('<span class="tag rec">recommended</span>');
    if (hasMods(r.name)) tags.push('<span class="tag mods">mods available</span>');
    if (!playable) tags.push('<span class="tag off">client only</span>');
    // One accent per list: the row you should press is the recommended revision.
    const cls = r.recommended ? "primary" : "ghost";
    // Installed revisions are a state, not an action — this list installs and
    // reports, it never selects (that lives in the installs list).
    const btn = have
      ? `<span class="chip ok" title="already installed at ${esc(have.path)} — manage it in the installs list">✓ installed</span>`
      : `<button class="${cls}" ${playable ? "" : "disabled"} onclick="install('${esc(r.name)}')">Install</button>`;
    const tip = `${r.name}: ${[r.client ? "client" : null, r.engine ? "engine" : null, r.content ? "content" : null].filter(Boolean).join(" + ")}`
      + (playable ? "" : " — no server content on this branch, so it can't be installed")
      + (have ? ` — installed at ${have.path}` : "");
    return `<div class="rev ${r.recommended ? "rec" : ""} ${have ? "installed" : ""} ${playable ? "" : "plain"}" title="${esc(tip)}">
      <span class="num">${esc(r.name)}</span>
      <span class="tags">${tags.join("")}</span>
      <span class="grow"></span>${btn}</div>`;
  }).join("");
}

// Rows show the TAIL of the path: the folder name is the informative part, and
// truncating the head makes every install look identical (the row's tooltip
// carries the whole path).
function tailPath(p, max){
  const s = String(p == null ? "" : p);
  const n = max || 46;
  return s.length <= n ? s : "…" + s.slice(s.length - n + 1);
}

function installRows(){
  const list = S.installs || [];
  if (!list.length) return `<div class="empty">Nothing here yet — pick a revision above and we'll do the rest.</div>`;
  return list.map(i => `
    <div class="install ${sel === i.id ? "on" : ""}" tabindex="0" onclick="selectInstall('${esc(i.id)}')"
         onkeydown="if(event.key==='Enter'){selectInstall('${esc(i.id)}')}" title="${esc(i.path)}">
      <div class="top">
        <span class="name">${esc(i.id)}</span>
        ${i.missing ? '<span class="tag off" title="this folder is gone — remove it from the list">missing</span>' : ""}
        ${i.custom ? '<span class="tag off">existing folder</span>' : ""}
        ${i.missing ? "" : (i.mods_allowed ? `<span class="pill mods" title="${(i.mods || []).length || 0} of the available mods are built into this install">${(i.mods || []).length ? `${(i.mods || []).length} mods` : "no mods yet"}</span>` : "")}
        ${i.missing ? "" : (i.engine_deps
          ? '<span class="pill good" title="the engine\'s dependencies are installed — this install can start">ready</span>'
          : '<span class="pill" title="the engine\'s dependencies are not installed yet — install this revision again to finish setup">setup incomplete</span>')}
        <span class="grow"></span>
        <span class="acts">
          <button class="ghost" title="take it out of this list — nothing is deleted from disk" onclick="event.stopPropagation();removeInstall('${esc(i.id)}', false)">Remove</button>
          <button class="danger" title="${i.custom ? "folders you added are never deleted from here" : "delete these files from disk (asks first)"}"
            ${i.custom ? "disabled" : ""} onclick="event.stopPropagation();removeInstall('${esc(i.id)}', true)">Delete files</button>
        </span>
      </div>
      <div class="path" title="${esc(i.path)}">${esc(tailPath(i.path))}</div>
    </div>`).join("");
}

function currentInstall(){ return (S.installs || []).find(i => i.id === sel) || null; }

// What the tree currently has applied, so a tick can tell you it's not committed yet.
let modsBase = [];
// The picked mods live in JS, not in the DOM: the list folds to MOD_PREVIEW rows,
// and a hidden checkbox must still count — reading the DOM would make Apply strip
// every mod you can't see.
let modPick = null;

// initModPick seeds the selection from the install's applied mods (or the full
// available set when nothing has been applied yet). Required mods are always in.
// Mods with no hunks for this revision are never seeded: they cannot be applied here,
// so ticking them would make the dirty flag lie and the apply report a phantom change.
function initModPick(i){
  if (!i) { modPick = new Set(); return; }
  const here = (i.mods_available || []).filter(m => m.available !== false);
  const avail = here.map(m => m.name);
  const required = here.filter(m => m.required).map(m => m.name);
  const on = (i.mods && i.mods.length) ? i.mods : avail;
  modPick = new Set(avail.filter(n => on.includes(n) || required.includes(n)));
}

function modSelection(){
  return [...(modPick || [])].sort();
}

function onModTick(el){
  if (!modPick) modPick = new Set();
  if (el.checked) modPick.add(el.dataset.mod); else modPick.delete(el.dataset.mod);
  refreshModsDirty();
}

function refreshModsDirty(){
  const cur = modSelection();
  const base = [...modsBase].sort();
  const dirty = JSON.stringify(cur) !== JSON.stringify(base);
  const hint = $("modsdirty");
  if (hint) hint.style.display = dirty ? "" : "none";
  const btn = $("applymods");
  if (btn) {
    btn.classList.toggle("dirty", dirty);
    btn.textContent = dirty ? "Apply mods & build *" : "Apply mods & build";
  }
}

// The selected install: what it is, how it's doing, and the two git-level jobs
// (update / rebuild). It sits under the install list because it describes the
// row you picked — the everyday things (Start, mods) have panels of their own.
function installCardHTML(){
  const i = currentInstall();
  if (!i) {
    return `<div class="empty">${(S.installs || []).length ? "Pick an install above." : "Install a revision and it shows up here — mods, server, housekeeping."}</div>`;
  }
  if (i.missing) {
    return `
      <div class="card" style="border-color:#5a3630;background:linear-gradient(180deg,#241816,#1d1413)">
        <h3 style="color:var(--bad)">This folder is gone</h3>
        <div class="path">${esc(i.path)}</div>
        <div class="hint">The launcher remembers it, but nothing is at that path any more — it was moved,
        deleted, or it points at an older layout. Taking it out of the list changes nothing on disk.</div>
        <button style="margin-top:10px" onclick="removeInstall('${esc(i.id)}', false)">Remove from the list</button>
      </div>`;
  }
  const facts = [
    i.has_client ? "client ✓" : "client ✗",
    i.has_engine ? "engine ✓" : "engine ✗",
    i.has_overlay ? "overlay ✓" : "overlay ✗",
    i.engine_deps ? "deps ✓" : "deps ✗",
    i.client_bundle ? "bundle ✓" : "bundle ✗"
  ].join(" · ");
  return `
    <div class="card selcard">
      <div class="cap">Selected install</div>
      <h3>${esc(i.rev_label || i.id)} ${i.custom ? '<span class="tag off">existing folder</span>' : ""}
        <span class="grow"></span>${i.engine_deps
          ? '<span class="pill good" title="the engine\'s dependencies are installed — this install can start">ready</span>'
          : '<span class="pill" title="the engine\'s dependencies are not installed yet">setup incomplete</span>'}</h3>
      ${i.engine_deps ? "" : `<div class="hint" style="margin-top:2px">The engine's dependencies aren't installed here yet, so
        <b>Start</b> would fail — ${i.custom
          ? `run <span class="path">npm install</span> in its <span class="path">engine/</span> folder to finish it.`
          : `<b>Update from GitHub</b> below installs them.`}</div>`}
      <div class="row wrap" style="margin-top:9px">
        <button onclick="updateInstall()" ${i.custom ? "disabled" : ""}
          title="pull the newest upstream code into this install, then re-apply your mods">Update from GitHub</button>
        <button onclick="buildOnly()" title="re-apply the mods and rebuild the client bundle">Rebuild client</button>
      </div>
      <details class="block"><summary>What's in this install</summary>
        <div class="inner">
          <div class="path">${esc(i.path)}</div>
          <div class="hint" style="margin-top:6px">${facts}${i.built_at && !i.built_at.startsWith("0001") ? " · built " + ago(i.built_at) : ""}</div>
          <div class="hint"><b>webclient/</b> the browser client · <b>engine/</b> the world · <b>content/</b> game data${i.has_overlay ? " · <b>lclite/</b> the mod overlay" : ""}.
          <b>Update from GitHub</b> is the safe way to move this install forward; it refuses if you have local changes.</div>
        </div>
      </details>
    </div>`;
}

// Mods for the selected install. Own panel, under the install list: the right
// column leads with the things you press every day (Start, Join server).
// The list itself starts folded to MOD_PREVIEW rows — the panel then reads as
// "here are your mods" at a glance, and the full list is one click away.
function modsHTML(){
  const i = currentInstall();
  if (!i) {
    return `<div class="empty">${(S.installs || []).length ? "Pick an install above — its mods show up here." : "Install a revision and its mods show up here."}</div>`;
  }
  if (i.missing) {
    return `<div class="note" style="margin-top:0">This install's folder is gone, so there is nothing to mod — take it out of the list above.</div>`;
  }
  if (!i.mods_allowed) {
    return `<div class="note" style="margin-top:0">${i.has_overlay
      ? `This overlay has no corpus for revision ${esc(i.rev_label || "?")} — the mods it ships are for ${esc(overlayRevs().join(", "))}, so they stay off here.`
      : `No LCLite overlay in this install, so there are no mods to switch on — LCLite's mods live in the ${esc(overlayRevs()[0])} install.`}</div>`;
  }
  // modPick is the source of truth for what is ticked (see initModPick): the list
  // can be folded, so the DOM is not.
  const chosen = modPick || new Set((i.mods && i.mods.length) ? i.mods : (i.mods_available || []).filter(m => m.available !== false).map(m => m.name));
  const rows = (i.mods_available || []).map(m => `
    <div class="modrow ${m.required ? "req" : ""}${m.available === false ? " off" : ""}">
      ${m.available === false
        ? `<span class="modcheck" data-mod="${esc(m.name)}" data-unavailable="1" title="no hunks for ${esc(i.rev_label || "this revision")} — the overlay supports this mod on ${esc(overlayRevs().join(", "))}">—</span>`
        : m.required
          ? `<span class="modcheck" data-mod="${esc(m.name)}" data-required="1" title="always included">✓</span>`
          : `<input type="checkbox" data-mod="${esc(m.name)}" ${chosen.has(m.name) ? "checked" : ""} onchange="onModTick(this)">`}
      <div><div class="mname">${esc(m.label)}${m.available === false ? ' <span class="tag off">not on this revision</span>' : ""}</div><div class="mdesc">${esc(m.desc)}</div></div>
    </div>`);
  const n = rows.length;
  const unavailable = (i.mods_available || []).filter(m => m.available === false).length;
  const shown = modsOpen ? rows : rows.slice(0, MOD_PREVIEW);
  const more = n > MOD_PREVIEW
    ? `<div class="more"><button class="linky" onclick="toggleModList()">${modsOpen ? "Show fewer ▴" : `Show all ${n} mods ▾`}</button>${modsOpen ? "" : ` · ${MOD_PREVIEW} of ${n} shown`}</div>`
    : "";
  return `
    <div class="sub" style="margin:0 0 8px">For <b>${esc(i.rev_label || i.id)}</b> — ${modsOpen
      ? "tick what you want, then apply. Unticked mods are stripped back to upstream."
      : `the first ${Math.min(MOD_PREVIEW, n)} are shown; open the list to tick the rest. <b>Applying removes every mod you haven't ticked.</b>`}${i.overlay_source === "checkout" ? ` These come from <span class="path" title="${esc(i.overlay_path || "")}">${esc(tailPath(i.overlay_path, 38))}</span>, so edits there apply straight away.` : ""}</div>
    ${unavailable ? `<div class="hint" style="margin:0 0 8px">${unavailable} mod${unavailable === 1 ? " has" : "s have"} no hunks for ${esc(i.rev_label || "this revision")} yet and stay off — a mod is all-or-nothing per revision, because half a mod is a broken mod. Porting one is <span class="path">node tools/port.mjs ${esc(i.rev_label || "")}</span>.</div>` : ""}
    <div class="row wrap">
      <button class="primary" id="applymods" onclick="applyMods()">Apply mods &amp; build</button>
      <button onclick="stripMods()" title="take every mod off and leave the upstream client">Remove mods</button>
      <span class="note" id="modsdirty" style="display:none;margin:0 0 0 4px">Not applied yet — the client still has the old set.</span>
    </div>
    <div class="modlist" style="margin-top:9px">${shown.join("") || '<div class="empty">no mods found in lclite/mods</div>'}</div>
    ${more}
    <details class="block"><summary>Something's broken? Reset to pristine</summary>
      <div class="inner hint">Throws away every local change in webclient/ and engine/ with git — the blunt repair for a tree that drifted. Use <b>Remove mods</b> for ordinary mod removal.</div>
      <button class="danger" style="margin-top:9px" onclick="revertMods()">Reset to pristine</button>
    </details>`;
}

function serverHTML(){
  const e = S.engine || {};
  return `
    <div class="card">
      <div class="status"><span class="dot" id="sdot"></span><span id="serverstatus"></span></div>
      <div class="grid2" style="margin-top:12px">
        <div><label class="f">Web port</label>
          <input type="number" id="port" min="1" max="65535" value="${e.port || 80}"
            style="max-width:104px;font-family:var(--mono);text-align:center" oninput="this.dataset.touched=1"></div>

      <details class="block"><summary>Ports &amp; running two worlds</summary>
        <div class="inner hint">Runs <span class="path">npm run quickstart</span> inside that install's engine folder. The engine takes three
        ports — the web port above, the game port (43594) and the setup page (8898) — and the launcher moves the last two out of the way if
        they're taken, which is how two revisions can run side by side. The first boot repacks the game cache and can take a minute.</div>
      </details>

}

// Joining someone else's world is a different job from running your own, so it
// gets its own panel instead of being a footnote under the local server.
// The everyday path is one field and one button; the bridge port and whose
// client to serve are real choices but not first-run ones, so they fold away.
function joinHTML(){
  return `
    <div class="card">
      <label class="f">Server address</label>
      <input type="text" id="remoteurl" placeholder="play.example.com:443">
      <div class="hint" style="margin-top:5px">Hostname, IP or full URL — <span class="path">192.168.1.20:8888</span> and <span class="path">https://play.example.com</span> both work.</div>
      <div class="row wrap" style="margin-top:11px">
        <button class="primary" id="bridgebtn" onclick="startProxy()">Bridge &amp; play</button>
        <button onclick="openDirect()">Open directly</button>
        <button id="stopbridgebtn" onclick="stopProxy()">Stop bridge</button>
      </div>
      <div class="hint" id="bridgehint"></div>
      <details class="block"><summary>Advanced — bridge port and whose client to serve</summary>
        <div class="inner">
          <div class="grid2">
            <div><label class="f">Bridge port</label><input type="number" id="proxyport" min="1" max="65535" value="${S.proxy_port || 8890}"></div>
            <div><label class="f">Serve my build</label>
              <select id="proxylocal">
                <option value="0">no — use their client</option>
                <option value="1">yes — my client, their world</option>
              </select></div>
          </div>
          <div class="hint">The client dials whatever host served it, so the bridge tunnels both the page and the game socket to that address.
          <b>Serve my build</b> swaps in your own built client, which is how your mods follow you onto someone else's world.
          A server that pins <b>allowedOrigin</b> can refuse a bridged socket — open it directly instead.</div>
        </div>
      </details>
    </div>`;
}

/* ---- worlds ---------------------------------------------------------------
   A world is somebody else's server plus a signed description of it. There is no
   directory service, so the list is local: you paste an invite code and it stays
   on this machine.

   Two things this panel must never imply, because both would be lies:

   1. A mod rule is a GATE, not enforcement. The client is JavaScript the host
      serves, so a determined player can always lie about what they run. The check
      reads what YOUR launcher actually applied (from the tree's own
      installed.json, not from ticked boxes) and refuses/warns honestly — which
      stops accidents, which is the case that actually happens.
   2. A save does not travel on its own. It is a file on the HOST's disk; the
      client never sees it. The vault is the launcher moving that file for you,
      and the copy says so.

   The worlds payload is fetched separately from /api/state, on purpose: the state
   poll runs every 2.5s and probing every world on that cadence would be both slow
   and rude. So this list refreshes when you ask it to. */
let W = null;                  // the /api/worlds payload
let worldsFilled = false;      // the host form is filled ONCE so the poll can't eat typing
let worldsShowOffline = false; // offline non-favorites fold away
let lastGate = null;           // the last mod-rule verdict, so "turn them off" can act on it
let myModRules = {};           // host's own policy: mod name -> "req" | "ban" (absent = no rule)
let SV = null;                 // the save list for the selected install

async function loadWorlds(){
  try { W = await api("worlds"); } catch (e) { return; }
  fillWorldsForm();
  renderWorlds(true);
}

function worldsSig(){
  const e = S.engine || {};
  return JSON.stringify(W) + "|" + (e.state || "") + "|" + (e.install || "") + "|" +
    worldsShowOffline + "|" + sel + "|" + (myModRules ? Object.keys(myModRules).length : 0);
}

function renderWorlds(force){
  const el = $("worlds");
  if (!el) return;
  const s = worldsSig();
  if (!force && s === sig.worlds) return;
  sig.worlds = s;
  el.innerHTML = worldsHTML();
  const sub = $("worldssub");
  if (sub && W) {
    const list = W.worlds || [];
    const fav = list.filter(v => v.favorite).length;
    const up = list.filter(v => v.online).length;
    sub.textContent = list.length
      ? `${up} online · ${list.length} saved${fav ? ` · ${fav} favorite${fav === 1 ? "" : "s"}` : ""} — worlds live on this machine, nothing is uploaded`
      : "worlds you have been invited to — kept on this machine";
  }
}

function worldsHTML(){
  if (!W) return '<div class="empty">reading your world list…</div>';
  const all = W.worlds || [];
  if (!all.length) {
    return `<div class="empty">No worlds yet. Paste an invite code below, or run a world on this machine and press <b>List my world</b>.</div>`;
  }
  // A favorite is pinned: it stays in the list while offline, because a world you
  // care about going down is exactly when you want to see it.
  const shown = all.filter(v => v.online || v.favorite || v.self);
  const hidden = all.filter(v => !shown.includes(v));

  let out = shown.map(worldCardHTML).join("");
  if (hidden.length) {
    out += worldsShowOffline
      ? hidden.map(worldCardHTML).join("") +
        `<div class="row" style="margin-top:8px"><button class="ghost" onclick="worldsShowOffline=false;renderWorlds(true)">Hide ${hidden.length} offline</button></div>`
      : `<div class="row" style="margin-top:8px"><button class="ghost" onclick="worldsShowOffline=true;renderWorlds(true)">${hidden.length} offline world${hidden.length === 1 ? "" : "s"} hidden — show</button></div>`;
  }
  return out;
}

function worldCardHTML(v){
  const m = v.manifest || {};
  const self = !!v.self;
  const cls = ["worldcard"];
  if (self) cls.push("self"); else if (v.signed) cls.push("signed"); else cls.push("unsigned");
  if (!v.online) cls.push("offline");
  if (v.favorite) cls.push("fav");

  const tags = [];
  if (self) tags.push('<span class="wtag self">this machine</span>');
  if (m.rev) tags.push(`<span class="wtag">revision ${esc(m.rev)}</span>`);
  if (v.online) tags.push('<span class="wtag ok">online</span>');
  else if (v.status === "not-a-world") tags.push('<span class="wtag ban">not a Lost City world</span>');
  else tags.push('<span class="wtag">offline</span>');

  // The signature is the only thing about a world that is actually verifiable, so
  // it gets a sentence rather than an icon.
  let trust;
  if (self) trust = `<span title="this world runs on this machine">signed by you</span>`;
  else if (v.verify_error) trust = `<span style="color:var(--bad)">signature check FAILED — ${esc(v.verify_error)}</span>`;
  else if (v.signed) trust = `<span style="color:var(--good)">signed</span> <span class="mono">${esc(v.fingerprint || "")}</span>`;
  else trust = `<span style="color:var(--warn)">unsigned</span> — nothing about this world can be verified`;

  const mods = [];
  (m.req || []).forEach(n => mods.push(`<span class="wtag req" title="recommended: you are warned if you are missing it, and may still join">wants ${esc(n)}</span>`));
  (m.ban || []).forEach(n => mods.push(`<span class="wtag ban" title="not allowed here: you are asked to turn it off before joining">bans ${esc(n)}</span>`));
  if (m.save) mods.push('<span class="wtag ok" title="this world accepts a character file you bring from another world">accepts imported characters</span>');

  const seen = v.last_seen && !String(v.last_seen).startsWith("0001")
    ? `last seen ${ago(v.last_seen)}` : "";
  const detail = v.detail ? esc(v.detail) : "";

  const acts = [];
  if (self) {
    const running = (S.engine || {}).state === "running";
    acts.push(running
      ? `<button onclick="stopServer()">Stop world</button>`
      : `<button class="primary" onclick="play()">Start world</button>`);
    acts.push(`<button class="ghost" onclick="showMyWorld()">List my world</button>`);
    if (v.code) acts.push(`<button class="ghost" onclick="copyText(${JSON.stringify(v.code).replace(/"/g, "&quot;")},'Invite code')">Copy invite code</button>`);
  } else {
    acts.push(`<button class="primary" onclick="joinWorld(${JSON.stringify(m.id || "").replace(/"/g, "&quot;")})">Join</button>`);
    acts.push(`<button class="ghost" onclick="copyText(${JSON.stringify(v.code || "").replace(/"/g, "&quot;")},'Invite code')">Copy code</button>`);
    acts.push(`<button class="ghost" onclick="forgetWorld(${JSON.stringify(m.id || "").replace(/"/g, "&quot;")})">Forget</button>`);
  }

  const star = self ? "" :
    `<button class="wstar ${v.favorite ? "on" : ""}" title="${v.favorite ? "unpin" : "pin to the top and keep it visible while it is offline"}"
      onclick="toggleWorldFav(${JSON.stringify(m.id || "").replace(/"/g, "&quot;")},${v.favorite ? "false" : "true"})">${v.favorite ? "★" : "☆"}</button>`;

  return `
  <div class="${cls.join(" ")}">
    <h4>${star}<span>${esc(m.name || "unnamed world")}</span><span class="grow"></span>${tags.join("")}</h4>
    ${m.desc ? `<div class="wdesc">${esc(m.desc)}</div>` : ""}
    <div class="wmeta"><span>${trust}</span>${m.host ? `<span>host ${esc(m.host)}</span>` : ""}${m.addr ? `<span class="mono">${esc(m.addr)}</span>` : ""}${seen ? `<span>${esc(seen)}</span>` : ""}${detail ? `<span>${detail}</span>` : ""}</div>
    ${mods.length ? `<div class="wmods">${mods.join("")}</div>` : ""}
    <div class="acts">${acts.join("")}</div>
  </div>`;
}
